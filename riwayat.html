<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Pengisian - KPP FMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.KPP_ALLOWED_ROLES=["gl", "admin", "atasan"];
window.KPP_ACTIVE_PAGE="riwayat";
</script>
<script src="auth.js"></script>
<script src="storage-master.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f6f8;color:#222}.header{background:#1f2937;color:#fff;padding:20px;text-align:center}
.header h1{font-size:22px;margin-bottom:5px}.header p{font-size:14px;opacity:.8}
.container{max-width:1300px;margin:30px auto;padding:20px}.box{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.right-tools{display:flex;align-items:center;gap:10px}
.total{background:#eff6ff;color:#2563eb;padding:10px 15px;border-radius:8px;font-size:14px;font-weight:bold}
.refresh-btn{background:#16a34a;color:#fff;border:none;padding:10px 15px;border-radius:7px;cursor:pointer}
.refresh-btn:disabled{opacity:.6;cursor:not-allowed}
.table-container{overflow:auto;max-height:70vh}table{width:100%;border-collapse:collapse;min-width:1350px}
th{background:#1f2937;color:#fff;padding:12px;font-size:13px;white-space:nowrap;position:sticky;top:0}
td{padding:11px;border-bottom:1px solid #e5e7eb;font-size:13px;text-align:center;white-space:nowrap}tr:hover{background:#f8fafc}
.unit,.operator,.fuel{font-weight:bold}.status{text-align:center;padding:18px;color:#64748b;font-size:12px;line-height:1.5}
.error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-bottom:15px;display:none}
.more-wrap{display:none;justify-content:center;padding-top:12px}.more-wrap.show{display:flex}.load-more{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:8px;padding:10px 16px;font-size:12px;font-weight:800;cursor:pointer}.load-more:disabled{opacity:.55;cursor:not-allowed}
.back{display:inline-block;margin-top:20px;color:#2563eb;text-decoration:none;font-size:14px}
@media(max-width:900px){
  .container{padding:8px;margin:10px auto}
  .box{padding:12px;border-radius:10px}
  .header{padding:14px 10px}
  .header h1{font-size:18px}
  .header p{font-size:12px}
  .title{flex-direction:column;align-items:stretch;gap:10px}
  .title h2{font-size:18px}
  .right-tools{width:100%;justify-content:space-between;gap:8px}
  .total,.refresh-btn{font-size:12px}
  .refresh-btn{min-height:42px}
  .table-container{
    max-height:66vh;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    border:1px solid #e5e7eb;
    border-radius:7px;
  }
  table{min-width:1250px}
  th,td{font-size:10px;padding:7px 6px}
  .back{display:none}
  .app-nav-inner{justify-content:flex-start}
  .app-nav a{padding:9px 12px;font-size:12px}
  .kpp-userbar-inner{padding:8px 10px;flex-wrap:wrap}
}
@media(max-width:520px){
  .right-tools{display:grid;grid-template-columns:1fr 1fr}
  .total{display:flex;align-items:center;justify-content:center;text-align:center}
  .load-more{width:100%;min-height:42px}
}

/* ===== KPP-FMS GLOBAL NAV ===== */
.app-nav{
    background:#111827;
    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid #374151;
    padding:9px 12px;
    position:sticky;
    top:0;
    z-index:999;
}
.app-nav-inner{
    max-width:1250px;
    margin:0 auto;
    display:flex;
    gap:8px;
    align-items:center;
    overflow-x:auto;
    scrollbar-width:thin;
}
.app-nav a{
    color:#e5e7eb;
    text-decoration:none;
    padding:9px 13px;
    border-radius:7px;
    white-space:nowrap;
    font-size:13px;
    font-weight:bold;
    border:1px solid transparent;
}
.app-nav a:hover{
    background:#374151;
    color:#fff;
}
.app-nav a.active{
    background:#2563eb;
    color:#fff;
    border-color:#60a5fa;
}

.kpp-userbar{background:#fff;border-bottom:1px solid #e5e7eb}
.kpp-userbar-inner{max-width:1250px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}
.kpp-userbar-inner span{color:#64748b}
.kpp-userbar button{border:0;border-radius:7px;padding:8px 11px;background:#dc2626;color:#fff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>KPP FUEL MANAGEMENT SYSTEM</h1><p>PT KPP - Riwayat Pengisian Fuel</p></div>
<div id="kppUserBar" class="kpp-userbar"></div>
<div id="kppRoleNav"></div>
<div class="container"><div class="box">
<div class="title"><h2>📋 Riwayat Pengisian</h2><div class="right-tools"><div class="total">Total Transaksi: <span id="totalData">0</span></div><button class="refresh-btn" id="refreshBtn">↻ Refresh</button></div></div>
<div class="error" id="errorBox"></div>
<div class="table-container"><table>
<thead><tr><th>No</th><th>Tanggal</th><th>Jam</th><th>Unit</th><th>Operator Unit</th><th>Fuelman</th><th>Fuel Truck</th><th>WH</th><th>HM Awal</th><th>HM Akhir</th><th>HM Jalan</th><th>Fuel (L)</th><th>Shift</th></tr></thead>
<tbody id="historyTable"></tbody>
</table></div>
<div id="statusData" class="status">Mengambil data terbaru dari database...</div>
<div id="moreWrap" class="more-wrap"><button id="loadMoreBtn" class="load-more" type="button">MUAT 300 DATA LAGI</button></div>
</div></div>

<script>
let HISTORY_STORAGE_ROWS=[];
let HISTORY_FT_MAP={};
let HISTORY_WH_TO_FTS=new Map();
let STORAGE_MASTER_READY=false;
const PAGE_SIZE=300;
let HISTORY_OFFSET=0;
let HISTORY_TOTAL=0;
let HISTORY_LOADING=false;

async function loadStorageMasterHistory(){
  if(STORAGE_MASTER_READY)return;
  if(!window.KPPStorage)throw new Error("Master MT/FT belum termuat.");
  HISTORY_STORAGE_ROWS=await window.KPPStorage.load(KPP.db,{activeOnly:false});
  HISTORY_FT_MAP=window.KPPStorage.ftMap(HISTORY_STORAGE_ROWS);
  HISTORY_WH_TO_FTS=new Map();
  Object.entries(HISTORY_FT_MAP).forEach(([ft,wh])=>{
    if(!wh)return;
    if(!HISTORY_WH_TO_FTS.has(wh))HISTORY_WH_TO_FTS.set(wh,[]);
    HISTORY_WH_TO_FTS.get(wh).push(ft);
  });
  STORAGE_MASTER_READY=true;
}

function formatAngka(v){if(v===null||v===undefined||v==="")return "-";return Number(v).toLocaleString("id-ID")}
function formatTanggal(v){if(!v)return "-";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
function cell(t,cls=""){const x=document.createElement("td");x.textContent=t;if(cls)x.className=cls;return x}

function getFuelTruck(item){
  const ft=String(item.fuel_truck||"").trim().toUpperCase();
  if(ft)return ft;
  const wh=window.KPPStorage?.normalizeWarehouse(item.wh)||String(item.wh||"").trim().toUpperCase();
  const candidates=HISTORY_WH_TO_FTS.get(wh)||[];
  return candidates.length===1?candidates[0]:"-";
}

function getWH(item){
  const direct=window.KPPStorage?.normalizeWarehouse(item.wh)||String(item.wh||"").trim().toUpperCase();
  if(direct)return direct;
  const ft=String(item.fuel_truck||"").trim().toUpperCase();
  return HISTORY_FT_MAP[ft]||"-";
}

function getFuelman(item){
  return String(item.fuelman_name||item.fuelman_username||"").trim()||"-";
}

async function fetchHistoryPage(offset){
  const {data,error,count}=await KPP.db
    .from("fuel_history")
    .select("id,tanggal,jam,unit,operator,hm_awal,hm_akhir,hm_jalan,fuel,shift,fuel_truck,wh,session_id,fuelman_name,fuelman_username",{count:"exact"})
    .order("tanggal",{ascending:false})
    .order("id",{ascending:false})
    .range(offset,offset+PAGE_SIZE-1);
  if(error)throw error;
  return {data:data||[],count:Number(count||0)};
}

function appendRows(data,startIndex){
  const table=document.getElementById("historyTable");
  data.forEach((item,index)=>{
    const row=document.createElement("tr");
    row.appendChild(cell(startIndex+index+1));
    row.appendChild(cell(formatTanggal(item.tanggal)));
    row.appendChild(cell(item.jam?String(item.jam).substring(0,8):"-"));
    row.appendChild(cell(item.unit||"(KOSONG)","unit"));
    row.appendChild(cell(item.operator||"-","operator"));
    row.appendChild(cell(getFuelman(item)));
    row.appendChild(cell(getFuelTruck(item)));
    row.appendChild(cell(getWH(item)));
    row.appendChild(cell(Number(item.hm_awal)>0?formatAngka(item.hm_awal):"-"));
    row.appendChild(cell(formatAngka(item.hm_akhir)));
    row.appendChild(cell(Number(item.hm_jalan)>0?formatAngka(item.hm_jalan)+" HM":"-"));
    row.appendChild(cell(formatAngka(item.fuel)+" L","fuel"));
    row.appendChild(cell("Shift "+item.shift));
    table.appendChild(row);
  });
}

function updatePagingStatus(){
  const status=document.getElementById("statusData");
  const more=document.getElementById("moreWrap");
  const shown=Math.min(HISTORY_OFFSET,HISTORY_TOTAL);
  document.getElementById("totalData").textContent=HISTORY_TOTAL.toLocaleString("id-ID");
  status.style.display="block";
  status.textContent=HISTORY_TOTAL?`Menampilkan ${shown.toLocaleString("id-ID")} transaksi terbaru dari ${HISTORY_TOTAL.toLocaleString("id-ID")}.`:"Belum ada data pengisian fuel.";
  more.classList.toggle("show",shown<HISTORY_TOTAL);
}

async function tampilkanRiwayat(reset=true){
  if(HISTORY_LOADING)return;
  const table=document.getElementById("historyTable");
  const status=document.getElementById("statusData");
  const errorBox=document.getElementById("errorBox");
  const refresh=document.getElementById("refreshBtn");
  const loadMore=document.getElementById("loadMoreBtn");

  HISTORY_LOADING=true;
  refresh.disabled=true;
  loadMore.disabled=true;
  errorBox.style.display="none";

  if(reset){
    HISTORY_OFFSET=0;
    HISTORY_TOTAL=0;
    table.replaceChildren();
    document.getElementById("totalData").textContent="0";
    document.getElementById("moreWrap").classList.remove("show");
    status.style.display="block";
    status.textContent="Mengambil data terbaru dari database...";
  }else{
    status.textContent="Memuat data berikutnya...";
  }

  try{
    await loadStorageMasterHistory();
    const start=HISTORY_OFFSET;
    const result=await fetchHistoryPage(start);
    HISTORY_TOTAL=result.count;
    appendRows(result.data,start);
    HISTORY_OFFSET=start+result.data.length;
    updatePagingStatus();
  }catch(error){
    console.error(error);
    errorBox.style.display="block";
    errorBox.textContent="❌ Gagal mengambil data: "+(error?.message||"Unknown error");
    if(reset&&HISTORY_OFFSET===0)status.textContent="Data belum berhasil dimuat.";
  }finally{
    HISTORY_LOADING=false;
    refresh.disabled=false;
    loadMore.disabled=false;
  }
}

document.getElementById("refreshBtn").addEventListener("click",()=>tampilkanRiwayat(true));
document.getElementById("loadMoreBtn").addEventListener("click",()=>tampilkanRiwayat(false));

document.addEventListener("kpp-auth-ready",()=>{
  tampilkanRiwayat(true);
});
</script>
</body>
</html>
