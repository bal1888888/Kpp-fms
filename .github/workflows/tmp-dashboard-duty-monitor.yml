name: Temp Dashboard Duty Monitor

on:
  push:
    branches:
      - feat/dashboard-duty-monitor-v1
    paths:
      - scripts/tmp_patch_dashboard_duty_monitor.py
      - .github/workflows/tmp-dashboard-duty-monitor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-duty-monitor-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch dashboard monitoring
        run: python3 scripts/tmp_patch_dashboard_duty_monitor.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add shift duty monitoring to dashboard"
          git push origin feat/dashboard-duty-monitor-v1
