name: Temp Fuelman Duty PIC Transfer
on:
  push:
    branches:
      - feat/fuelman-duty-pic-transfer-v1
    paths:
      - .github/workflows/tmp-fuelman-duty-pic-transfer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuelman-duty-pic-transfer-v1
          fetch-depth: 0
      - name: Patch Fuelman duty UI
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re, json

          def must_sub(pattern,repl,text,label,flags=re.S):
              out,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{label} replacement count={n}')
              return out

          # fuelman.html
          p=Path('fuelman.html'); s=p.read_text()
          s=s.replace(
            '<b>Alur Fuelman:</b><br>\n    Start Shift → pilih Shift & Fuel Truck → Pengisian / Stock → Closing Stock → End Shift.',
            '<b>Alur Shift Fuelman:</b><br>\n    Start Shift → pilih Shift & Tugas. <b>FUELMAN</b> memilih FT dan bertanggung jawab atas Pengisian + Closing FT miliknya. <b>PIC TRANSFER</b> hanya melihat Stock dan wajib Closing semua MT aktif sebelum End Shift.',
            1
          )
          start_grid='''\n    <div class="grid">\n      <div>\n        <label>Shift</label>\n        <select id="shift">\n          <option value="">-- Pilih Shift --</option>\n          <option value="Shift 1">Shift 1</option>\n          <option value="Shift 2">Shift 2</option>\n        </select>\n      </div>\n\n      <div>\n        <label>Tugas Shift</label>\n        <select id="dutyType">\n          <option value="">-- Pilih Tugas --</option>\n          <option value="FUELMAN">FUELMAN</option>\n          <option value="PIC_TRANSFER">PIC TRANSFER</option>\n        </select>\n      </div>\n\n      <div id="fuelTruckGroup" class="hidden">\n        <label>Fuel Truck</label>\n        <select id="fuelTruck"><option value="">-- Pilih Fuel Truck --</option></select>\n      </div>\n    </div>\n'''
          s=must_sub(r'(\s*<div id="startPanel" class="panel hidden">\s*<h2>.*?Start Shift</h2>)\s*<div class="grid">.*?</div>\s*<div class="actions">',lambda m:m.group(1)+start_grid+'\n    <div class="actions">',s,'fuelman start grid')
          s=must_sub(r'<div class="session-row">\s*<b>Shift</b>\s*<span id="sShift">-</span>\s*</div>\s*<div class="session-row">\s*<b>Fuel Truck</b>\s*<span id="sTruck">-</span>\s*</div>', '''<div class="session-row">\n        <b>Shift</b>\n        <span id="sShift">-</span>\n      </div>\n      <div class="session-row">\n        <b>Tugas Shift</b>\n        <span id="sDuty">-</span>\n      </div>\n      <div class="session-row" id="sTruckRow">\n        <b>Fuel Truck</b>\n        <span id="sTruck">-</span>\n      </div>''',s,'fuelman active rows')
          s=s.replace('<a class="btn btn-blue" href="pengisian.html">⛽ Pengisian</a>','<a id="fuelingLink" class="btn btn-blue" href="pengisian.html">⛽ Pengisian</a>',1)
          marker='let STORAGE_ROWS=window.KPPStorage.fallbackRows();'
          helper='''let STORAGE_ROWS=window.KPPStorage.fallbackRows();\n\nfunction dutyLabel(value){return value==="PIC_TRANSFER"?"PIC TRANSFER":"FUELMAN";}\nfunction syncDutyForm(){\n  const duty=document.getElementById("dutyType")?.value||"";\n  const group=document.getElementById("fuelTruckGroup");\n  const truck=document.getElementById("fuelTruck");\n  if(!group||!truck)return;\n  const needsTruck=duty==="FUELMAN";\n  group.classList.toggle("hidden",!needsTruck);\n  truck.disabled=!needsTruck;\n  if(!needsTruck)truck.value="";\n}'''
          if marker not in s: raise SystemExit('fuelman JS marker missing')
          s=s.replace(marker,helper,1)
          funcs='''function renderActive(){\n  if(!currentSession)return;\n  const duty=currentSession.duty_type||"FUELMAN";\n  document.getElementById("sFuelman").textContent=currentSession.fuelman_name||"-";\n  document.getElementById("sTanggal").textContent=fmtDate(currentSession.tanggal);\n  document.getElementById("sShift").textContent=currentSession.shift||"-";\n  document.getElementById("sDuty").textContent=dutyLabel(duty);\n  document.getElementById("sTruck").textContent=currentSession.fuel_truck||"-";\n  document.getElementById("sTruckRow").classList.toggle("hidden",duty==="PIC_TRANSFER");\n  document.getElementById("fuelingLink").classList.toggle("hidden",duty==="PIC_TRANSFER");\n  document.getElementById("sMulai").textContent=fmtTime(currentSession.jam_mulai);\n  hide("startPanel"); show("activePanel");\n}\n\nasync function startShift(){\n  const shift=document.getElementById("shift").value;\n  const dutyType=document.getElementById("dutyType").value;\n  const fuelTruck=dutyType==="FUELMAN"?document.getElementById("fuelTruck").value:null;\n  const status=document.getElementById("startStatus"),btn=document.getElementById("startBtn");\n  status.textContent="";\n  if(!shift){status.textContent="❌ Pilih Shift.";return;}\n  if(!dutyType){status.textContent="❌ Pilih Tugas Shift.";return;}\n  if(dutyType==="FUELMAN"&&!fuelTruck){status.textContent="❌ FUELMAN wajib memilih Fuel Truck.";return;}\n  const responsibility=dutyType==="PIC_TRANSFER"?"Closing semua MT aktif sebelum End Shift":`Closing ${fuelTruck} sebelum End Shift`;\n  if(!confirm(`Mulai shift?\\n\\nFuelman: ${currentProfile.display_name}\\nShift: ${shift}\\nTugas: ${dutyLabel(dutyType)}`+(fuelTruck?`\\nFuel Truck: ${fuelTruck}`:"")+`\\nTanggung jawab: ${responsibility}`))return;\n  btn.disabled=true;btn.textContent="MEMULAI...";\n  const {data,error}=await KPP.db.rpc("start_fuelman_shift",{p_shift:shift,p_duty_type:dutyType,p_fuel_truck:fuelTruck||null});\n  btn.disabled=false;btn.textContent="START SHIFT";\n  if(error){status.textContent="❌ "+error.message;return;}\n  currentSession=data?.data||null;\n  if(!currentSession){status.textContent="❌ Session belum terkonfirmasi. Refresh halaman sebelum mencoba lagi.";return;}\n  renderActive();\n}\n\nasync function endShift(){\n  if(!currentSession)return;\n  const duty=currentSession.duty_type||"FUELMAN";\n  const responsibility=duty==="PIC_TRANSFER"?"semua MT aktif":currentSession.fuel_truck;\n  if(!confirm(`Akhiri shift?\\n\\n${currentSession.shift} • ${dutyLabel(duty)}`+(currentSession.fuel_truck?` • ${currentSession.fuel_truck}`:"")+`\\n\\nWajib sudah Closing: ${responsibility}.`))return;\n  const btn=document.getElementById("endBtn"),status=document.getElementById("endStatus");\n  btn.disabled=true;btn.textContent="MENGAKHIRI...";status.textContent="";\n  const {data,error}=await KPP.db.rpc("end_fuelman_shift",{p_session_id:currentSession.id});\n  btn.disabled=false;btn.textContent="END SHIFT";\n  if(error){status.textContent="❌ "+error.message+" Buka menu Stock dan lengkapi sonding yang diwajibkan.";return;}\n  if(!data?.ok){status.textContent="❌ End Shift belum terkonfirmasi. Refresh halaman sebelum mencoba lagi.";return;}\n  currentSession=null;\n  document.getElementById("shift").value="";document.getElementById("dutyType").value="";document.getElementById("fuelTruck").value="";syncDutyForm();\n  document.getElementById("startStatus").textContent="✅ Shift sebelumnya sudah diakhiri.";\n  hide("activePanel");show("startPanel");\n}\n\ndocument.getElementById("dutyType").addEventListener("change",syncDutyForm);\ndocument.getElementById("startBtn").addEventListener("click",startShift);\ndocument.getElementById("endBtn").addEventListener("click",endShift);'''
          s=must_sub(r'function renderActive\(\)\{.*?document\.getElementById\("endBtn"\)\.addEventListener\("click",endShift\);',funcs,s,'fuelman lifecycle')
          s=s.replace('await loadFuelTruckMaster();\n  await loadActiveSession();','await loadFuelTruckMaster();\n  syncDutyForm();\n  await loadActiveSession();',1)
          p.write_text(s)

          # stock.html
          p=Path('stock.html'); s=p.read_text()
          css='''\n/* ===== KPP-FMS FUELMAN DUTY VISIBILITY v1 ===== */\n.pic-transfer-mode .converter-panel,\n.pic-transfer-mode .opening-panel,\n.pic-transfer-mode .receipt-panel,\n.pic-transfer-mode .transfer-panel,\n.pic-transfer-mode .movement-panel,\n.pic-transfer-mode .workflow-compact-tools{display:none!important}\n'''
          if 'KPP-FMS FUELMAN DUTY VISIBILITY v1' not in s:s=s.replace('</style>',css+'\n</style>',1)
          s=must_sub(r'<div id="fuelmanSessionInfo" class="session-info hidden">.*?</div>\s*\n\s*<div class="panel period-panel">','''<div id="fuelmanSessionInfo" class="session-info hidden">\n    <strong> SHIFT FUELMAN AKTIF</strong><br>\n    Fuelman: <span id="sessionFuelman">-</span><br>\n    Shift: <span id="sessionShift">-</span><br>\n    Tugas: <span id="sessionDuty">-</span><br>\n    <span id="sessionTruckLine">Fuel Truck: <span id="sessionTruck">-</span><br></span>\n    <span id="sessionResponsibility">Tanggal/shift dan tanggung jawab Closing mengikuti session.</span>\n</div>\n\n<div class="panel period-panel">''',s,'stock session info')
          s=must_sub(r'function closingStoragesForAccount\(\)\{.*?\n\}', '''function closingStoragesForAccount(){\n    if(!(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman" && ACTIVE_FUELMAN_SESSION))return STORAGES;\n    if(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"){\n        return STORAGE_ROWS.filter(row=>row.active!==false && row.storage_type==="MT").map(row=>row.code);\n    }\n    return ACTIVE_FUELMAN_SESSION.fuel_truck?[ACTIVE_FUELMAN_SESSION.fuel_truck]:[];\n}''',s,'stock closing scope')
          apply='''function applyFuelmanIdentity(){\n    applyAccountSoundingIdentity();\n    if(!CURRENT_PROFILE || CURRENT_PROFILE.role!=="fuelman" || !ACTIVE_FUELMAN_SESSION)return;\n    const name=ACTIVE_FUELMAN_SESSION.fuelman_name||CURRENT_PROFILE.display_name||"";\n    const duty=ACTIVE_FUELMAN_SESSION.duty_type||"FUELMAN",picTransfer=duty==="PIC_TRANSFER";\n    document.body.classList.toggle("pic-transfer-mode",picTransfer);\n    document.querySelectorAll('a[href="pengisian.html"]').forEach(link=>link.classList.toggle("hidden",picTransfer));\n    fillStorageSelect("editSource",true);fillStorageSelect("editDestination",false);\n    const openingStorage=document.getElementById("openingStorage");\n    if(openingStorage&&!picTransfer){openingStorage.value=ACTIVE_FUELMAN_SESSION.fuel_truck||"";openingStorage.disabled=true;openingStorage.classList.add("locked-field");updateOpeningConversion();}\n    document.getElementById("sessionFuelman").textContent=name||"-";\n    document.getElementById("sessionShift").textContent=ACTIVE_FUELMAN_SESSION.shift||"-";\n    document.getElementById("sessionDuty").textContent=picTransfer?"PIC TRANSFER":"FUELMAN";\n    document.getElementById("sessionTruck").textContent=ACTIVE_FUELMAN_SESSION.fuel_truck||"-";\n    document.getElementById("sessionTruckLine").classList.toggle("hidden",picTransfer);\n    document.getElementById("sessionResponsibility").textContent=picTransfer?"PIC TRANSFER: hanya melihat posisi stock dan wajib Closing semua MT aktif sebelum End Shift.":"FUELMAN: Closing hanya untuk FT yang sedang dibawa sebelum End Shift.";\n    document.getElementById("fuelmanSessionInfo").classList.remove("hidden");\n}\n\nasync function loadFuelmanSession(){'''
          s=must_sub(r'function applyFuelmanIdentity\(\)\{.*?\n\}\n\nasync function loadFuelmanSession\(\)\{',apply,s,'stock fuelman identity')
          s=s.replace('ACTIVE_FUELMAN_SESSION=data[0];','ACTIVE_FUELMAN_SESSION={...data[0],duty_type:data[0].duty_type||"FUELMAN"};',1)
          s=s.replace('''        storage=ACTIVE_FUELMAN_SESSION.fuel_truck;\n        operator=ACTIVE_FUELMAN_SESSION.fuelman_name||CURRENT_PROFILE.display_name||operator;''','''        if(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"){alert("PIC TRANSFER hanya melihat stock dan melakukan Closing semua MT aktif.");return;}\n        storage=ACTIVE_FUELMAN_SESSION.fuel_truck;\n        operator=ACTIVE_FUELMAN_SESSION.fuelman_name||CURRENT_PROFILE.display_name||operator;''',1)
          s=must_sub(r'const closingStorages=\s*isFuelman\s*\? \[ACTIVE_FUELMAN_SESSION\.fuel_truck\]\s*: STORAGES;','const closingStorages=closingStoragesForAccount();',s,'stock save closing scope')
          s=s.replace('"[OK] Closing "+ACTIVE_FUELMAN_SESSION.fuel_truck+','"[OK] Closing "+(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"?"semua MT aktif":ACTIVE_FUELMAN_SESSION.fuel_truck)+')
          p.write_text(s)

          # pengisian.html
          p=Path('pengisian.html'); s=p.read_text()
          anchor='activeFuelmanSession = data[0];\n\n    const shiftNumber = shiftSessionToNumber(activeFuelmanSession.shift);'
          replacement='activeFuelmanSession = data[0];\n\n    if((activeFuelmanSession.duty_type||"FUELMAN")==="PIC_TRANSFER"){\n        alert("PIC TRANSFER tidak memiliki akses Pengisian Fuel. Gunakan menu Stock untuk melihat posisi stock dan Closing semua MT aktif.");\n        window.location.replace("stock.html");\n        return;\n    }\n\n    const shiftNumber = shiftSessionToNumber(activeFuelmanSession.shift);'
          if anchor not in s: raise SystemExit('pengisian session anchor missing')
          s=s.replace(anchor,replacement,1);p.write_text(s)

          # package
          p=Path('package.json'); pkg=json.loads(p.read_text()); cmd=pkg['scripts']['check']; test='scripts/test-fuelman-duty-pic-transfer.mjs'
          if test not in cmd:
              needle='scripts/test-stock-mobile-workflow-collapse.mjs'
              if needle not in cmd: raise SystemExit('package anchor missing')
              pkg['scripts']['check']=cmd.replace(needle,needle+' '+test)
          p.write_text(json.dumps(pkg,indent=2)+'\n')
          PY
          python3 /tmp/patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-fuelman-duty-pic-transfer.yml
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuelman.html stock.html pengisian.html package.json .github/workflows/tmp-fuelman-duty-pic-transfer.yml
          git commit -m "feat: add Fuelman shift duty UI and PIC Transfer closing" || exit 0
          git push origin HEAD:feat/fuelman-duty-pic-transfer-v1
