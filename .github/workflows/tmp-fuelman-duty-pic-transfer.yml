name: Temp Fuelman Duty PIC Transfer
on:
  push:
    branches:
      - feat/fuelman-duty-pic-transfer-v1
    paths:
      - .github/workflows/tmp-fuelman-duty-pic-transfer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuelman-duty-pic-transfer-v1
          fetch-depth: 0
      - name: Patch Fuelman duty UI
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re, json

          # ---------- fuelman.html ----------
          p=Path('fuelman.html')
          s=p.read_text()
          s=s.replace(
          '''  <div class="info">
            <b>Alur Fuelman:</b><br>
            Start Shift → pilih Shift & Fuel Truck → Pengisian / Stock → Closing Stock → End Shift.
          </div>''',
          '''  <div class="info">
            <b>Alur Shift Fuelman:</b><br>
            Start Shift → pilih Shift & Tugas. <b>FUELMAN</b> memilih FT dan bertanggung jawab atas pengisian + Closing FT miliknya. <b>PIC TRANSFER</b> fokus melihat Stock dan wajib Closing semua MT aktif sebelum End Shift.
          </div>''')

          old_grid='''    <div class="grid">
              <div>
                <label>Shift</label>
                <select id="shift">
                  <option value="">-- Pilih Shift --</option>
                  <option value="Shift 1">Shift 1</option>
                  <option value="Shift 2">Shift 2</option>
                </select>
              </div>
        
              <div>
                <label>Fuel Truck</label>
                <select id="fuelTruck"><option value="">-- Pilih Fuel Truck --</option></select>
              </div>
            </div>'''
          new_grid='''    <div class="grid">
              <div>
                <label>Shift</label>
                <select id="shift">
                  <option value="">-- Pilih Shift --</option>
                  <option value="Shift 1">Shift 1</option>
                  <option value="Shift 2">Shift 2</option>
                </select>
              </div>
        
              <div>
                <label>Tugas Shift</label>
                <select id="dutyType">
                  <option value="">-- Pilih Tugas --</option>
                  <option value="FUELMAN">FUELMAN</option>
                  <option value="PIC_TRANSFER">PIC TRANSFER</option>
                </select>
              </div>
        
              <div id="fuelTruckGroup" class="hidden">
                <label>Fuel Truck</label>
                <select id="fuelTruck"><option value="">-- Pilih Fuel Truck --</option></select>
              </div>
            </div>'''
          if old_grid not in s:
              raise SystemExit('fuelman start grid anchor not found')
          s=s.replace(old_grid,new_grid,1)

          old_active='''      <div class="session-row">
                <b>Shift</b>
                <span id="sShift">-</span>
              </div>
              <div class="session-row">
                <b>Fuel Truck</b>
                <span id="sTruck">-</span>
              </div>'''
          new_active='''      <div class="session-row">
                <b>Shift</b>
                <span id="sShift">-</span>
              </div>
              <div class="session-row">
                <b>Tugas Shift</b>
                <span id="sDuty">-</span>
              </div>
              <div class="session-row" id="sTruckRow">
                <b>Fuel Truck</b>
                <span id="sTruck">-</span>
              </div>'''
          if old_active not in s:
              raise SystemExit('fuelman active session anchor not found')
          s=s.replace(old_active,new_active,1)
          s=s.replace('<a class="btn btn-blue" href="pengisian.html">⛽ Pengisian</a>', '<a id="fuelingLink" class="btn btn-blue" href="pengisian.html">⛽ Pengisian</a>',1)

          marker='''let currentProfile=null;
          let currentSession=null;
          let STORAGE_ROWS=window.KPPStorage.fallbackRows();'''
          replacement='''let currentProfile=null;
          let currentSession=null;
          let STORAGE_ROWS=window.KPPStorage.fallbackRows();
          
          function dutyLabel(value){
            return value==="PIC_TRANSFER"?"PIC TRANSFER":"FUELMAN";
          }
          
          function syncDutyForm(){
            const duty=document.getElementById("dutyType")?.value||"";
            const group=document.getElementById("fuelTruckGroup");
            const truck=document.getElementById("fuelTruck");
            if(!group||!truck)return;
            const needsTruck=duty==="FUELMAN";
            group.classList.toggle("hidden",!needsTruck);
            truck.disabled=!needsTruck;
            if(!needsTruck)truck.value="";
          }'''
          if marker not in s:
              raise SystemExit('fuelman JS marker not found')
          s=s.replace(marker,replacement,1)

          pattern=r'''function renderActive\(\)\{.*?document\.getElementById\("startBtn"\)\.addEventListener\("click",startShift\);\s*document\.getElementById\("endBtn"\)\.addEventListener\("click",endShift\);'''
          new_funcs=r'''function renderActive(){
            if(!currentSession)return;
          
            const duty=currentSession.duty_type||"FUELMAN";
            document.getElementById("sFuelman").textContent=currentSession.fuelman_name||"-";
            document.getElementById("sTanggal").textContent=fmtDate(currentSession.tanggal);
            document.getElementById("sShift").textContent=currentSession.shift||"-";
            document.getElementById("sDuty").textContent=dutyLabel(duty);
            document.getElementById("sTruck").textContent=currentSession.fuel_truck||"-";
            document.getElementById("sTruckRow").classList.toggle("hidden",duty==="PIC_TRANSFER");
            document.getElementById("fuelingLink").classList.toggle("hidden",duty==="PIC_TRANSFER");
            document.getElementById("sMulai").textContent=fmtTime(currentSession.jam_mulai);
          
            hide("startPanel");
            show("activePanel");
          }
          
          async function startShift(){
            const shift=document.getElementById("shift").value;
            const dutyType=document.getElementById("dutyType").value;
            const fuelTruck=dutyType==="FUELMAN"?document.getElementById("fuelTruck").value:null;
            const status=document.getElementById("startStatus");
            const btn=document.getElementById("startBtn");
          
            status.textContent="";
            if(!shift){status.textContent="❌ Pilih Shift.";return;}
            if(!dutyType){status.textContent="❌ Pilih Tugas Shift.";return;}
            if(dutyType==="FUELMAN"&&!fuelTruck){status.textContent="❌ FUELMAN wajib memilih Fuel Truck.";return;}
          
            const responsibility=dutyType==="PIC_TRANSFER"
              ? "Closing semua MT aktif sebelum End Shift"
              : `Closing ${fuelTruck} sebelum End Shift`;
            const ok=confirm(
              `Mulai shift?\n\nFuelman: ${currentProfile.display_name}\nShift: ${shift}\nTugas: ${dutyLabel(dutyType)}`+
              (fuelTruck?`\nFuel Truck: ${fuelTruck}`:"")+`\nTanggung jawab: ${responsibility}`
            );
            if(!ok)return;
          
            btn.disabled=true;
            btn.textContent="MEMULAI...";
          
            const {data,error}=await KPP.db.rpc("start_fuelman_shift",{
              p_shift:shift,
              p_duty_type:dutyType,
              p_fuel_truck:fuelTruck||null
            });
          
            btn.disabled=false;
            btn.textContent="START SHIFT";
          
            if(error){
              status.textContent="❌ "+error.message;
              return;
            }
          
            currentSession=data?.data||null;
            if(!currentSession){
              status.textContent="❌ Server tidak mengembalikan session. Refresh halaman sebelum mencoba lagi.";
              return;
            }
            renderActive();
          }
          
          async function endShift(){
            if(!currentSession)return;
            const duty=currentSession.duty_type||"FUELMAN";
            const responsibility=duty==="PIC_TRANSFER"
              ? "semua MT aktif"
              : currentSession.fuel_truck;
          
            const ok=confirm(
              `Akhiri shift?\n\n${currentSession.shift} • ${dutyLabel(duty)}`+
              (currentSession.fuel_truck?` • ${currentSession.fuel_truck}`:"")+
              `\n\nWajib sudah Closing: ${responsibility}.`
            );
            if(!ok)return;
          
            const btn=document.getElementById("endBtn");
            const status=document.getElementById("endStatus");
            btn.disabled=true;
            btn.textContent="MENGAKHIRI...";
            status.textContent="";
          
            const {data,error}=await KPP.db.rpc("end_fuelman_shift",{
              p_session_id:currentSession.id
            });
          
            btn.disabled=false;
            btn.textContent="END SHIFT";
          
            if(error){
              status.textContent="❌ "+error.message+" Buka menu Stock dan lengkapi sonding yang diwajibkan.";
              return;
            }
          
            if(!data?.ok){
              status.textContent="❌ End Shift belum terkonfirmasi. Refresh halaman sebelum mencoba lagi.";
              return;
            }
          
            currentSession=null;
            document.getElementById("shift").value="";
            document.getElementById("dutyType").value="";
            document.getElementById("fuelTruck").value="";
            syncDutyForm();
            document.getElementById("startStatus").textContent="✅ Shift sebelumnya sudah diakhiri.";
          
            hide("activePanel");
            show("startPanel");
          }
          
          document.getElementById("dutyType").addEventListener("change",syncDutyForm);
          document.getElementById("startBtn").addEventListener("click",startShift);
          document.getElementById("endBtn").addEventListener("click",endShift);'''
          s2,n=re.subn(pattern,new_funcs,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'fuelman functions replacement count={n}')
          s=s2
          s=s.replace('''  await loadFuelTruckMaster();
            await loadActiveSession();''','''  await loadFuelTruckMaster();
            syncDutyForm();
            await loadActiveSession();''',1)
          p.write_text(s)

          # ---------- stock.html ----------
          p=Path('stock.html')
          s=p.read_text()
          css='''\n/* ===== KPP-FMS FUELMAN DUTY VISIBILITY v1 ===== */
          .pic-transfer-mode .converter-panel,
          .pic-transfer-mode .opening-panel,
          .pic-transfer-mode .receipt-panel,
          .pic-transfer-mode .transfer-panel,
          .pic-transfer-mode .movement-panel,
          .pic-transfer-mode .workflow-compact-tools{display:none!important}
          '''
          if 'KPP-FMS FUELMAN DUTY VISIBILITY v1' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          old_info='''<div id="fuelmanSessionInfo" class="session-info hidden">
              <strong> SHIFT FUELMAN AKTIF</strong><br>
              Fuelman: <span id="sessionFuelman">-</span><br>
              Shift: <span id="sessionShift">-</span><br>
              Fuel Truck: <span id="sessionTruck">-</span><br>
              <span>Untuk akun Fuelman, tanggal/shift mengikuti session dan Stock Closing hanya untuk Fuel Truck yang sedang dipakai.</span>
          </div>'''
          new_info='''<div id="fuelmanSessionInfo" class="session-info hidden">
              <strong> SHIFT FUELMAN AKTIF</strong><br>
              Fuelman: <span id="sessionFuelman">-</span><br>
              Shift: <span id="sessionShift">-</span><br>
              Tugas: <span id="sessionDuty">-</span><br>
              <span id="sessionTruckLine">Fuel Truck: <span id="sessionTruck">-</span><br></span>
              <span id="sessionResponsibility">Tanggal/shift dan tanggung jawab Closing mengikuti session.</span>
          </div>'''
          if old_info not in s:
              raise SystemExit('stock session info anchor not found')
          s=s.replace(old_info,new_info,1)

          old_closing='''function closingStoragesForAccount(){
              return CURRENT_PROFILE &&
                  CURRENT_PROFILE.role==="fuelman" &&
                  ACTIVE_FUELMAN_SESSION
                      ? [ACTIVE_FUELMAN_SESSION.fuel_truck]
                      : STORAGES;
          }'''
          new_closing='''function closingStoragesForAccount(){
              if(!(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman" && ACTIVE_FUELMAN_SESSION)){
                  return STORAGES;
              }
              if(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"){
                  return STORAGE_ROWS
                      .filter(row=>row.active!==false && row.storage_type==="MT")
                      .map(row=>row.code);
              }
              return ACTIVE_FUELMAN_SESSION.fuel_truck
                  ? [ACTIVE_FUELMAN_SESSION.fuel_truck]
                  : [];
          }'''
          if old_closing not in s:
              raise SystemExit('stock closingStoragesForAccount anchor not found')
          s=s.replace(old_closing,new_closing,1)

          pattern=r'''function applyFuelmanIdentity\(\)\{.*?\n\}\n\nasync function loadFuelmanSession\(\)\{'''
          new_apply=r'''function applyFuelmanIdentity(){
              applyAccountSoundingIdentity();
          
              if(!CURRENT_PROFILE || CURRENT_PROFILE.role!=="fuelman" || !ACTIVE_FUELMAN_SESSION){
                  return;
              }
          
              const name=ACTIVE_FUELMAN_SESSION.fuelman_name||CURRENT_PROFILE.display_name||"";
              const duty=ACTIVE_FUELMAN_SESSION.duty_type||"FUELMAN";
              const picTransfer=duty==="PIC_TRANSFER";
          
              document.body.classList.toggle("pic-transfer-mode",picTransfer);
              document.querySelectorAll('a[href="pengisian.html"]').forEach(link=>{
                  link.classList.toggle("hidden",picTransfer);
              });
          
              fillStorageSelect("editSource",true);
              fillStorageSelect("editDestination",false);
          
              const openingStorage=document.getElementById("openingStorage");
              if(openingStorage && !picTransfer){
                  openingStorage.value=ACTIVE_FUELMAN_SESSION.fuel_truck||"";
                  openingStorage.disabled=true;
                  openingStorage.classList.add("locked-field");
                  updateOpeningConversion();
              }
          
              document.getElementById("sessionFuelman").textContent=name||"-";
              document.getElementById("sessionShift").textContent=ACTIVE_FUELMAN_SESSION.shift||"-";
              document.getElementById("sessionDuty").textContent=picTransfer?"PIC TRANSFER":"FUELMAN";
              document.getElementById("sessionTruck").textContent=ACTIVE_FUELMAN_SESSION.fuel_truck||"-";
              document.getElementById("sessionTruckLine").classList.toggle("hidden",picTransfer);
              document.getElementById("sessionResponsibility").textContent=picTransfer
                  ? "PIC TRANSFER: hanya melihat posisi stock dan wajib Closing semua MT aktif sebelum End Shift."
                  : "FUELMAN: Closing hanya untuk FT yang sedang dibawa sebelum End Shift.";
              document.getElementById("fuelmanSessionInfo").classList.remove("hidden");
          }
          
          async function loadFuelmanSession(){'''
          s2,n=re.subn(pattern,new_apply,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'stock applyFuelmanIdentity replacement count={n}')
          s=s2
          s=s.replace('''    ACTIVE_FUELMAN_SESSION=data[0];''','''    ACTIVE_FUELMAN_SESSION={...data[0],duty_type:data[0].duty_type||"FUELMAN"};''',1)

          old_block='''    if(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman"){
                  if(!ACTIVE_FUELMAN_SESSION){
                      window.location.replace("fuelman.html");
                      return;
                  }
                  storage=ACTIVE_FUELMAN_SESSION.fuel_truck;
                  operator=ACTIVE_FUELMAN_SESSION.fuelman_name||CURRENT_PROFILE.display_name||operator;
              }'''
          new_block='''    if(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman"){
                  if(!ACTIVE_FUELMAN_SESSION){
                      window.location.replace("fuelman.html");
                      return;
                  }
                  if(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"){
                      alert("PIC TRANSFER hanya melihat stock dan melakukan Closing semua MT aktif.");
                      return;
                  }
                  storage=ACTIVE_FUELMAN_SESSION.fuel_truck;
                  operator=ACTIVE_FUELMAN_SESSION.fuelman_name||CURRENT_PROFILE.display_name||operator;
              }'''
          if old_block not in s:
              raise SystemExit('stock saveOpening fuelman anchor not found')
          s=s.replace(old_block,new_block,1)

          old_assign='''    const closingStorages=
                  isFuelman
                      ? [ACTIVE_FUELMAN_SESSION.fuel_truck]
                      : STORAGES;'''
          if old_assign not in s:
              raise SystemExit('stock saveClosing assignment anchor not found')
          s=s.replace(old_assign,'''    const closingStorages=closingStoragesForAccount();''',1)

          old_success='''            isFuelman
                          ? "[OK] Closing "+ACTIVE_FUELMAN_SESSION.fuel_truck+
                            " tersimpan dan sudah terhubung ke session. Sekarang END SHIFT sudah boleh dilakukan."
                          : "[OK] Stock closing tersimpan. Stock fisik otomatis jadi Opening Shift "+'''
          new_success='''            isFuelman
                          ? "[OK] Closing "+(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"?"semua MT aktif":ACTIVE_FUELMAN_SESSION.fuel_truck)+
                            " tersimpan dan sudah terhubung ke session. Sekarang END SHIFT sudah boleh dilakukan."
                          : "[OK] Stock closing tersimpan. Stock fisik otomatis jadi Opening Shift "+'''
          if old_success not in s:
              raise SystemExit('stock carry success anchor not found')
          s=s.replace(old_success,new_success,1)
          old_success2='''            isFuelman
                          ? "[OK] Closing "+ACTIVE_FUELMAN_SESSION.fuel_truck+
                            " tersimpan dan sudah terhubung ke session. Sekarang END SHIFT sudah boleh dilakukan."
                          : "[OK] Stock closing tersimpan.";'''
          new_success2='''            isFuelman
                          ? "[OK] Closing "+(ACTIVE_FUELMAN_SESSION.duty_type==="PIC_TRANSFER"?"semua MT aktif":ACTIVE_FUELMAN_SESSION.fuel_truck)+
                            " tersimpan dan sudah terhubung ke session. Sekarang END SHIFT sudah boleh dilakukan."
                          : "[OK] Stock closing tersimpan.";'''
          if old_success2 not in s:
              raise SystemExit('stock no-carry success anchor not found')
          s=s.replace(old_success2,new_success2,1)
          p.write_text(s)

          # ---------- pengisian.html ----------
          p=Path('pengisian.html')
          s=p.read_text()
          anchor='''    activeFuelmanSession = data[0];
          
              const shiftNumber = shiftSessionToNumber(activeFuelmanSession.shift);'''
          replacement='''    activeFuelmanSession = data[0];
          
              if((activeFuelmanSession.duty_type||"FUELMAN")==="PIC_TRANSFER"){
                  alert("PIC TRANSFER tidak memiliki akses Pengisian Fuel. Gunakan menu Stock untuk melihat posisi stock dan Closing semua MT aktif.");
                  window.location.replace("stock.html");
                  return;
              }
          
              const shiftNumber = shiftSessionToNumber(activeFuelmanSession.shift);'''
          if anchor not in s:
              raise SystemExit('pengisian session anchor not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s)

          # ---------- package.json ----------
          p=Path('package.json')
          pkg=json.loads(p.read_text())
          cmd=pkg['scripts']['check']
          test='scripts/test-fuelman-duty-pic-transfer.mjs'
          if test not in cmd:
              needle='scripts/test-stock-mobile-workflow-collapse.mjs'
              if needle not in cmd:
                  raise SystemExit('package check anchor not found')
              cmd=cmd.replace(needle,needle+' '+test)
              pkg['scripts']['check']=cmd
          p.write_text(json.dumps(pkg,indent=2)+"\n")
          PY
          python3 /tmp/patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Remove temporary workflow
        run: rm -f .github/workflows/tmp-fuelman-duty-pic-transfer.yml
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuelman.html stock.html pengisian.html package.json .github/workflows/tmp-fuelman-duty-pic-transfer.yml
          git commit -m "feat: add Fuelman shift duty UI and PIC Transfer closing" || exit 0
          git push origin HEAD:feat/fuelman-duty-pic-transfer-v1
