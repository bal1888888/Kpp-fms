name: Temp stock closing revision UI

on:
  push:
    branches:
      - feat/stock-closing-revision-gl-admin-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/stock-closing-revision-gl-admin-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply UI patch
        run: python3 scripts/tmp_stock_closing_revision_patch.py

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Remove temporary patch files
        run: |
          rm scripts/tmp_stock_closing_revision_patch.py
          rm .github/workflows/tmp-stock-closing-revision-ui.yml

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.html package.json scripts/test-stock-closing-revision-gl-admin.mjs scripts/tmp_stock_closing_revision_patch.py .github/workflows/tmp-stock-closing-revision-ui.yml
          git commit -m "feat: allow final Stock Closing revision for GL Admin only"
          git push origin HEAD:feat/stock-closing-revision-gl-admin-v1
