name: Temp clean UI copy

on:
  push:
    branches:
      - style/clean-ui-copy-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: style/clean-ui-copy-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply UI copy cleanup
        run: python scripts/tmp_clean_ui_copy.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run checks
        run: npm run check
      - name: Verify banned copy is gone
        run: node scripts/test-ui-copy-clean.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/tmp-ui-copy-audit.yml
          rm scripts/tmp_clean_ui_copy.py
          git config user.name "kpp-ui-cleanup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --check --cached
          git commit -m "style: clean verbose operational UI copy"
          git push origin HEAD:style/clean-ui-copy-v1
