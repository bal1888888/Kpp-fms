name: Temp dynamic storage integration v2
on:
  push:
    branches: [feat/dynamic-storage-master-v1]
    paths: [.github/workflows/tmp-dynamic-storage-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-storage-master-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch dynamic Master MT FT integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(s.replace(old,new,1))

          def regex_once(path, pattern, repl):
              p=Path(path); s=p.read_text()
              out,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n != 1:
                  raise SystemExit(f"regex failed in {path}: {pattern[:100]!r}, n={n}")
              p.write_text(out)

          # Master: explicit same-type sounding reuse, easy default.
          replace_once('master-storage.html',
            '<div class="quick-note"><b>Mode cepat:</b> untuk storage baru cukup isi <b>Code Storage</b>. Sistem otomatis menentukan jenis, kapasitas standar, profil tera, status aktif, dan urutan tampil. Isi WH/Lokasi hanya bila perlu.</div>',
            '<div class="quick-note"><b>Mode cepat:</b> cukup isi <b>Code Storage</b>. MT baru otomatis memakai profil sounding/tera MT, FT baru memakai profil sounding/tera FT. Pilihan ini aman bila bentuk/tipe tangkinya sama. Jika fisiknya berbeda, buka <b>Pengaturan lanjutan</b> lalu pilih <b>Belum ada / fisik berbeda</b>. WH/Lokasi tetap opsional.</div>')
          replace_once('master-storage.html',
            '<div><label>Profil Tera</label><select id="teraProfile"><option value="">Belum ada tera</option><option value="MT">Tera MT</option><option value="FT">Tera FT</option></select></div>',
            '<div><label>Profil Sonding / Tera</label><select id="teraProfile"><option value="">Belum ada / fisik berbeda</option><option value="MT">Pakai sondingan tipe MT yang sama</option><option value="FT">Pakai sondingan tipe FT yang sama</option></select></div>')

          # Stock dynamic registry.
          replace_once('stock.html','<script src="auth.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>','<script src="auth.js"></script>\n<script src="storage-master.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>')
          replace_once('stock.html',
            'const STORAGES=["MT01","MT02","MT03","MT04","FT0073","FT0075"];\n\nconst STORAGE_CAPACITY={...TERA.nominalCapacity};\n\nconst STORAGE_HARD_CAPACITY=Object.fromEntries(\n    STORAGES.map(storage=>{\n        const curveName=TERA.storageCurve[storage];\n        const curve=TERA.curves[curveName];\n        return [storage,Number(curve[curve.length-1])];\n    })\n);',
            'let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet STORAGES=STORAGE_ROWS.map(row=>row.code);\nlet STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\nlet STORAGE_HARD_CAPACITY=window.KPPStorage.hardCapacityMap(TERA,STORAGE_ROWS);')
          replace_once('stock.html','const TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);','let TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);')
          replace_once('stock.html',
            'function capacity(storage){\n    return n(STORAGE_CAPACITY[storage]);\n}',
            'function storageRow(storage){return window.KPPStorage.byCode(STORAGE_ROWS,storage);}\nfunction storageLabel(storage){return window.KPPStorage.label(storageRow(storage)||{code:storage});}\nfunction teraLookup(storage,height){return window.KPPStorage.lookup(TERA,STORAGE_ROWS,storage,height);}\nfunction teraHeightForLiters(storage,liters){return window.KPPStorage.heightForLiters(TERA,STORAGE_ROWS,storage,liters);}\n\nfunction capacity(storage){\n    return n(STORAGE_CAPACITY[storage]);\n}')
          # All sounding conversions now honor tera_profile.
          p=Path('stock.html'); s=p.read_text()
          s=s.replace('TERA.heightForLiters(', 'teraHeightForLiters(')
          s=s.replace('return TERA.lookup(storage,input.value);','return teraLookup(storage,input.value);')
          s=s.replace('closingTera=TERA.lookup(storage,heightInput.value);','closingTera=teraLookup(storage,heightInput.value);')
          p.write_text(s)
          # Labels no longer hardcode specific FTs.
          p=Path('stock.html'); s=p.read_text()
          s=s.replace('option.textContent=\n            storage+\n            (storage==="FT0073"?" (WH FT02)":\n             storage==="FT0075"?" (WH FT01)":"");','option.textContent=storageLabel(storage);')
          s=s.replace('        let suffix="";\n        if(storage==="FT0073") suffix=" / WH FT02";\n        if(storage==="FT0075") suffix=" / WH FT01";','        const row=storageRow(storage);\n        const suffix=row?.warehouse ? " / "+row.warehouse : "";')
          p.write_text(s)
          replace_once('stock.html',
            'function sourceFromFuel(row){\n    const ft=String(row.fuel_truck||"").toUpperCase();\n    if(ft==="FT0073"||ft==="FT0075") return ft;\n\n    const wh=String(row.wh||"").toUpperCase();\n    if(wh==="FT02") return "FT0073";\n    if(wh==="FT01") return "FT0075";\n    return "";\n}',
            'function sourceFromFuel(row){\n    const ft=String(row.fuel_truck||"").trim().toUpperCase();\n    const direct=STORAGE_ROWS.find(item=>item.storage_type==="FT" && item.code===ft);\n    if(direct)return direct.code;\n    const wh=window.KPPStorage.normalizeWarehouse(row.wh);\n    const match=STORAGE_ROWS.find(item=>item.storage_type==="FT" && window.KPPStorage.whCode(item)===wh);\n    return match?.code||"";\n}')
          # Replace static select option bodies with loading placeholder.
          for sid in ['converterStorage','receiptDestination','transferSource','transferDestination']:
              regex_once('stock.html',rf'(<select id="{sid}"[^>]*>).*?(</select>)',rf'\1<option value="">Memuat Master MT / FT...</option>\2')
          # Replace bottom opening population with dynamic loader.
          regex_once('stock.html',
            r'const openingStorage=document\.getElementById\("openingStorage"\);\s*STORAGES\.forEach\(storage=>\{.*?openingStorage\.appendChild\(option\);\s*\}\);',
            '''function refreshStorageInputs(){
    ["converterStorage","openingStorage","receiptDestination","transferSource","transferDestination"].forEach(id=>fillStorageSelect(id,false));
    fillStorageSelect("editSource",true);
    fillStorageSelect("editDestination",false);
    syncTransferDestination();
    updateQuickConverter();
    updateOpeningConversion();
    updateReceiptCalculation();
}

async function loadStorageMaster(){
    STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:true});
    STORAGES=STORAGE_ROWS.map(row=>row.code);
    STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);
    STORAGE_HARD_CAPACITY=window.KPPStorage.hardCapacityMap(TERA,STORAGE_ROWS);
    TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+n(b),0);
    CURRENT_SYSTEM_STOCK=Object.fromEntries(STORAGES.map(storage=>[storage,0]));
    refreshStorageInputs();
}''')
          replace_once('stock.html',
            '    await loadTransporterOptions();\n\n    if(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman")',
            '    await loadStorageMaster();\n    await loadTransporterOptions();\n\n    if(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman")')

          # Daily Report dynamic storage and FT summary.
          replace_once('daily-report.html','<script src="auth.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>','<script src="auth.js"></script>\n<script src="storage-master.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>')
          regex_once('daily-report.html',
            r'const STORAGES=\["MT01","MT02","MT03","MT04","FT0073","FT0075"\];\s*const FT_MAP=\{.*?\};\s*const STORAGE_CAPACITY=\{.*?\};\s*const TOTAL_CAPACITY=Object\.values\(STORAGE_CAPACITY\)\.reduce\(\(a,b\)=>a\+b,0\);',
            '''let STORAGE_ROWS=window.KPPStorage.fallbackRows();
let STORAGES=STORAGE_ROWS.map(row=>row.code);
let FT_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);
let STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);
let TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);
async function loadStorageMaster(){
  STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:true});
  STORAGES=STORAGE_ROWS.map(row=>row.code);
  FT_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);
  STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);
  TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+n(b),0);
}''')
          replace_once('daily-report.html',
            'function estimatedSonding(storage,qty){\n  if(!TERA || typeof TERA.heightForLiters!=="function")return null;\n  return TERA.heightForLiters(storage,Math.max(0,n(qty)));\n}',
            'function estimatedSonding(storage,qty){\n  if(!TERA)return null;\n  try{return window.KPPStorage.heightForLiters(TERA,STORAGE_ROWS,storage,Math.max(0,n(qty)));}\n  catch{return null;}\n}')
          replace_once('daily-report.html',
            'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  if(ft==="FT0073"||ft==="FT0075")return ft;\n  const wh=String(row.wh||"").trim().toUpperCase();\n  if(wh==="FT02")return "FT0073";\n  if(wh==="FT01")return "FT0075";\n  return "";\n}',
            'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  const direct=STORAGE_ROWS.find(item=>item.storage_type==="FT" && item.code===ft);\n  if(direct)return direct.code;\n  const wh=window.KPPStorage.normalizeWarehouse(row.wh);\n  const match=STORAGE_ROWS.find(item=>item.storage_type==="FT" && window.KPPStorage.whCode(item)===wh);\n  return match?.code||"";\n}')
          regex_once('daily-report.html',r'  const result=\{\s*FT0073:\{1:0,2:0\},\s*FT0075:\{1:0,2:0\}\s*\};',
            '  const result=Object.fromEntries(\n    STORAGE_ROWS.filter(row=>row.storage_type==="FT").map(row=>[row.code,{1:0,2:0}])\n  );')
          replace_once('daily-report.html','  ["FT0073","FT0075"].forEach(ft=>{\n    const s1=n(summary[ft][1]);\n    const s2=n(summary[ft][2]);','  STORAGE_ROWS.filter(row=>row.storage_type==="FT").forEach(row=>{\n    const ft=row.code;\n    const s1=n(summary[ft]?.[1]);\n    const s2=n(summary[ft]?.[2]);')
          regex_once('daily-report.html',
            r'function makeReportText\(\{[\s\S]*?\n\}\n\nasync function loadReport\(\)\{',
            '''function makeReportText({
  reportDate,stock,totalStock,yesterday,ySummary,
  usageYesterday,usageMTD,avgMTD,ito,activeDays
}){
  const stockLines=STORAGE_ROWS.map(row=>{
    const label=row.warehouse ? `${row.code} / ${row.warehouse}` : row.code;
    return stockReportLine(label,row.code,stock[row.code]);
  }).join("\\n");
  const usageLines=STORAGE_ROWS.filter(row=>row.storage_type==="FT").map(row=>{
    const summary=ySummary[row.code]||{1:0,2:0};
    return `${row.code}${row.warehouse?` / ${row.warehouse}`:""}\\nShift 1 : ${fmt(summary[1])} LTR\\nShift 2 : ${fmt(summary[2])} LTR`;
  }).join("\\n\\n");
  return `UPDATE STOCK FUEL
${formatDateID(reportDate)}

${stockLines}

TOTAL STOCK FUEL = ${fmt(totalStock)} LTR

USAGE YESTERDAY (${formatDateID(yesterday)}):
${usageLines}

TOTAL PEMAKAIAN = ${fmt(usageYesterday)} LTR

USAGE MTD = ${fmt(usageMTD)} LTR
AVG MTD = ${fmt(avgMTD)} LTR/HARI (${activeDays} hari aktif)
ITO = ${fmtIto(ito)} HARI`;
}

async function loadReport(){''')
          replace_once('daily-report.html','document.addEventListener("kpp-auth-ready",()=>{\n  document.getElementById("reportDate").value=localDate();\n  loadReport();\n});','document.addEventListener("kpp-auth-ready",async()=>{\n  document.getElementById("reportDate").value=localDate();\n  await loadStorageMaster();\n  loadReport();\n});')

          # Dashboard dynamic storage/capacity.
          replace_once('dashboard.html','<script src="auth.js"></script>','<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          replace_once('dashboard.html',
            'const STORAGES=["MT01","MT02","MT03","MT04","FT0073","FT0075"];\nconst STORAGE_CAPACITY={MT01:40000,MT02:40000,MT03:40000,MT04:40000,FT0073:20000,FT0075:20000};\nconst TOTAL_CAPACITY=200000;',
            'let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet STORAGES=STORAGE_ROWS.map(row=>row.code);\nlet STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\nlet TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);\nasync function loadStorageMaster(){\n  STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:true});\n  STORAGES=STORAGE_ROWS.map(row=>row.code);\n  STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\n  TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+n(b),0);\n}')
          replace_once('dashboard.html',
            'function getFuelTruck(item){\n  const ft=String(item.fuel_truck||"").trim().toUpperCase();\n  if(ft)return ft;\n  const wh=String(item.wh||"").trim().toUpperCase();\n  if(wh==="FT02")return "FT0073";\n  if(wh==="FT01")return "FT0075";\n  return "-";\n}\nfunction getWH(item){\n  const wh=String(item.wh||"").trim().toUpperCase();\n  if(wh)return wh;\n  const ft=getFuelTruck(item);\n  if(ft==="FT0073")return "FT02";\n  if(ft==="FT0075")return "FT01";\n  return "-";\n}',
            'function getFuelTruck(item){\n  const ft=String(item.fuel_truck||"").trim().toUpperCase();\n  if(ft)return ft;\n  const wh=window.KPPStorage.normalizeWarehouse(item.wh);\n  const match=STORAGE_ROWS.find(row=>row.storage_type==="FT" && window.KPPStorage.whCode(row)===wh);\n  return match?.code||"-";\n}\nfunction getWH(item){\n  const wh=window.KPPStorage.normalizeWarehouse(item.wh);\n  if(wh)return wh;\n  const ft=getFuelTruck(item);\n  const row=STORAGE_ROWS.find(item=>item.code===ft);\n  return row?window.KPPStorage.whCode(row)||"-":"-";\n}')
          replace_once('dashboard.html',
            'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  if(ft==="FT0073"||ft==="FT0075")return ft;\n  const wh=String(row.wh||"").trim().toUpperCase();\n  if(wh==="FT02")return "FT0073";\n  if(wh==="FT01")return "FT0075";\n  return "";\n}',
            'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  const direct=STORAGE_ROWS.find(item=>item.storage_type==="FT" && item.code===ft);\n  if(direct)return direct.code;\n  const wh=window.KPPStorage.normalizeWarehouse(row.wh);\n  const match=STORAGE_ROWS.find(item=>item.storage_type==="FT" && window.KPPStorage.whCode(item)===wh);\n  return match?.code||"";\n}')
          replace_once('dashboard.html','document.addEventListener("kpp-auth-ready",loadDashboard);','document.addEventListener("kpp-auth-ready",async()=>{\n  await loadStorageMaster();\n  await loadDashboard();\n});')

          # Fuelman dynamic active FT selector.
          replace_once('fuelman.html','<script src="auth.js"></script>','<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          regex_once('fuelman.html',r'(<select id="fuelTruck">).*?(</select>)',r'\1<option value="">-- Pilih Fuel Truck --</option>\2')
          replace_once('fuelman.html','let currentProfile=null;\nlet currentSession=null;','let currentProfile=null;\nlet currentSession=null;\nlet STORAGE_ROWS=window.KPPStorage.fallbackRows();\nasync function loadFuelTruckMaster(){\n  STORAGE_ROWS=await window.KPPStorage.load(KPP.db,{activeOnly:true});\n  const rows=STORAGE_ROWS.filter(row=>row.storage_type==="FT");\n  const select=document.getElementById("fuelTruck");\n  select.innerHTML=\'<option value="">-- Pilih Fuel Truck --</option>\'+rows.map(row=>`<option value="${row.code}">${window.KPPStorage.label(row)}</option>`).join("");\n}')
          replace_once('fuelman.html','  currentProfile=e.detail.profile;\n  await loadActiveSession();','  currentProfile=e.detail.profile;\n  await loadFuelTruckMaster();\n  await loadActiveSession();')

          # Pengisian dynamic active FT selector + WH map.
          replace_once('pengisian.html','<script src="auth.js"></script>','<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          regex_once('pengisian.html',r'(<select id="fuelTruck">).*?(</select>)',r'\1<option value="">-- Pilih Fuel Truck --</option>\2')
          replace_once('pengisian.html','const FUEL_TRUCK_MAP = {\n    "FT0073": "FT02",\n    "FT0075": "FT01"\n};','let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet FUEL_TRUCK_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);\nasync function loadFuelTruckMaster(){\n    STORAGE_ROWS=await window.KPPStorage.load(supabaseClient,{activeOnly:true});\n    FUEL_TRUCK_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);\n    const select=document.getElementById("fuelTruck");\n    const selected=select.value;\n    const rows=STORAGE_ROWS.filter(row=>row.storage_type==="FT");\n    select.innerHTML=\'<option value="">-- Pilih Fuel Truck --</option>\'+rows.map(row=>`<option value="${row.code}">${window.KPPStorage.label(row)}</option>`).join("");\n    if(selected && rows.some(row=>row.code===selected))select.value=selected;\n}')
          p=Path('pengisian.html'); s=p.read_text()
          idx=s.find('document.addEventListener("kpp-auth-ready",async')
          if idx < 0: raise SystemExit('pengisian kpp-auth-ready async listener not found')
          brace=s.find('{',idx)
          s=s[:brace+1]+'\n    await loadFuelTruckMaster();'+s[brace+1:]
          p.write_text(s)

          # History filters use all master rows so inactive storage history remains searchable.
          replace_once('stock-history.html','<script src="auth.js"></script>','<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          replace_once('stock-history.html','const STORAGES=["MT01","MT02","MT03","MT04","FT0073","FT0075"];','let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet STORAGES=STORAGE_ROWS.map(row=>row.code);')
          replace_once('stock-history.html','function fillStorages(){for(const id of ["transferSource","transferDestination","closingStorage"]){const select=document.getElementById(id);STORAGES.forEach(storage=>select.insertAdjacentHTML("beforeend",`<option value="${storage}">${storage}</option>`))}}','function fillStorages(){for(const id of ["transferSource","transferDestination","closingStorage"]){const select=document.getElementById(id);select.querySelectorAll("option:not(:first-child)").forEach(option=>option.remove());STORAGE_ROWS.forEach(row=>select.insertAdjacentHTML("beforeend",`<option value="${esc(row.code)}">${esc(window.KPPStorage.label(row))}${row.active===false?" (NONAKTIF)":""}</option>`))}}\nasync function loadStorageMaster(){STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:false});STORAGES=STORAGE_ROWS.map(row=>row.code);fillStorages()}')
          p=Path('stock-history.html'); s=p.read_text()
          # Existing init calls fillStorages; let it use fallback first, then reload master on auth-ready.
          target='document.addEventListener("kpp-auth-ready",async'
          idx=s.find(target)
          if idx>=0:
              brace=s.find('{',idx); s=s[:brace+1]+'\nawait loadStorageMaster();'+s[brace+1:]
          else:
              target='document.addEventListener("kpp-auth-ready",()=>'
              idx=s.find(target)
              if idx>=0:
                  brace=s.find('{',idx); s=s[:idx]+s[idx:].replace(target,'document.addEventListener("kpp-auth-ready",async()=>',1)
                  idx=s.find('document.addEventListener("kpp-auth-ready",async()=>',idx); brace=s.find('{',idx); s=s[:brace+1]+'\nawait loadStorageMaster();'+s[brace+1:]
              else:
                  raise SystemExit('stock-history auth ready listener not found')
          p.write_text(s)

          # Regression checks for source-of-truth integration.
          p=Path('scripts/check-static.mjs'); s=p.read_text()
          anchor='const dashboardPath = path.join(projectRoot, "dashboard.html");'
          extra='''const storageHelperPath = path.join(projectRoot, "storage-master.js");
const storageHelperSource = fs.readFileSync(storageHelperPath, "utf8");
if (!storageHelperSource.includes("storage_master") || !storageHelperSource.includes("hardCapacityMap")) {
  fail(storageHelperPath, "helper Master MT/FT dinamis tidak lengkap");
}
if (!stockSource.includes("loadStorageMaster") || !stockSource.includes("teraLookup")) {
  fail(stockPath, "Stock belum memakai Master MT/FT dan profil sounding dinamis");
}
for (const dynamicPage of ["daily-report.html","fuelman.html","pengisian.html","stock-history.html"]) {
  const dynamicSource = fs.readFileSync(path.join(projectRoot, dynamicPage), "utf8");
  if (!dynamicSource.includes('src="storage-master.js"')) {
    fail(path.join(projectRoot, dynamicPage), "belum terhubung ke Master MT/FT dinamis");
  }
}

'''
          if anchor not in s: raise SystemExit('static check anchor missing')
          s=s.replace(anchor,extra+anchor,1)
          p.write_text(s)

          # Temp workflows never land in main.
          for tmp in ['.github/workflows/tmp-dynamic-storage.yml','.github/workflows/tmp-dynamic-storage-v2.yml']:
              pp=Path(tmp)
              if pp.exists(): pp.unlink()
          PY
      - name: Run project checks
        run: |
          npm ci
          npm run check
      - name: Commit integrated result
        run: |
          git config user.name "kpp-storage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect Master MT FT across fuel operations"
          git push origin HEAD:feat/dynamic-storage-master-v1
