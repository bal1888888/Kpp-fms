name: FC MTD context patch
on:
  push:
    branches: [feat/fc-mtd-context-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fc-mtd-context-v1
      - name: Apply FC MTD context patch
        run: python scripts/apply-fc-mtd-context.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        run: rm -f scripts/apply-fc-mtd-context.py .github/workflows/fc-mtd-context-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: jadikan grafik FC default MTD dan tambah snapshot" || exit 0
          git push
