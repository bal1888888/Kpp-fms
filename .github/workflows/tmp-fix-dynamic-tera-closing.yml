name: Temp fix dynamic tera closing
on:
  push:
    branches: [fix/dynamic-tera-closing-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/dynamic-tera-closing-v1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Patch dynamic tera calls and regression guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          stock=Path('stock.html')
          s=stock.read_text()
          old='const tera=TERA.lookup(storage,heightInput.value);'
          count=s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 direct TERA.lookup calls, found {count}')
          stock.write_text(s.replace(old,'const tera=teraLookup(storage,heightInput.value);'))

          test=Path('scripts/test-dynamic-storage-backend.mjs')
          t=test.read_text()
          anchor='test("master UI explains same-type reuse and immutable identity",()=>{'
          if anchor not in t:
              raise SystemExit('test anchor missing')
          guard='''test("Stock closing and copy preview use dynamic tera profile resolver",()=>{\n  assert.doesNotMatch(stock,/TERA\\.lookup\\(storage,/);\n  assert.match(stock,/teraLookup\\(storage,heightInput\\.value\\)/);\n});\n\n'''
          test.write_text(t.replace(anchor,guard+anchor,1))
          PY
          rm -f .github/workflows/tmp-fix-dynamic-tera-closing.yml
          npm ci --ignore-scripts
          npm run check
          git config user.name kpp-hardening-bot
          git config user.email actions@users.noreply.github.com
          git add stock.html scripts/test-dynamic-storage-backend.mjs .github/workflows/tmp-fix-dynamic-tera-closing.yml
          git commit -m "fix: use dynamic tera resolver for stock closing"
          git push origin HEAD:fix/dynamic-tera-closing-v1