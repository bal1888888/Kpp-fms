name: Temp radial UI across pages

on:
  push:
    branches:
      - ui/stock-radial-mobile-all

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stock-radial-mobile-all
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair patch script
        run: python scripts/tmp_fix_radial_runner.py
      - name: Apply patch
        run: python scripts/tmp_radial_all_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit result
        run: |
          rm -f scripts/tmp_fix_radial_runner.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: rapikan radial stock di HP dan halaman terkait"
          git push origin HEAD:ui/stock-radial-mobile-all
