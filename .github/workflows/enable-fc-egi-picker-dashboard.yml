name: Enable FC EGI Picker Dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add FC EGI picker to Dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('dashboard.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="fc-egi-tree-logsheet.js?v=20260917"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('dashboard body marker not found')
              s=s[:pos]+tag+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/enable-fc-egi-picker-dashboard.yml').unlink()
          PY
      - name: Commit Dashboard patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html .github/workflows/enable-fc-egi-picker-dashboard.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable EGI tree picker in Dashboard FC"
          git push
