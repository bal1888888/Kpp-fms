name: FC focus table patch
on:
  push:
    branches: [feat/fc-range-presets-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fc-range-presets-v1
      - name: Apply FC focus table patch
        run: python scripts/apply-fc-focus-table.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        run: rm -f scripts/apply-fc-focus-table.py .github/workflows/fc-focus-table-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: tambah fokus detail FC per unit" || exit 0
          git push
