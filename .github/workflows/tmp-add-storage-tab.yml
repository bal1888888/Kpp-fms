name: Temp add Master MT FT tab

on:
  push:
    branches:
      - fix/hm-master-storage-tab
    paths:
      - .github/workflows/tmp-add-storage-tab.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hm-master-storage-tab
      - name: Patch hm-master tab bar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hm-master.html')
          s = p.read_text(encoding='utf-8')
          old = '''        <button id="tabUnitBtn" class="tab-btn active" onclick="showTab('unit')">🚜 MASTER UNIT</button>\n        <button id="tabHmBtn" class="tab-btn" onclick="showTab('hm')">⚙️ HM MASTER</button>\n        <button id="tabTransporterBtn" class="tab-btn" onclick="showTab('transporter')">🚛 MASTER TRANSPORTIR</button>'''
          new = old + '''\n        <button class="tab-btn" type="button" onclick="window.location.href='master-storage.html'">🛢️ MASTER MT / FT</button>'''
          if old not in s:
              raise SystemExit('Target tab bar not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/tmp-add-storage-tab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hm-master.html .github/workflows/tmp-add-storage-tab.yml
          git commit -m "fix: add Master MT FT tab inside all masters"
          git push origin HEAD:fix/hm-master-storage-tab
