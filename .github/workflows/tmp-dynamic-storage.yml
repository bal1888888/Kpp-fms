name: Temp dynamic storage integration
on:
  push:
    branches: [feat/dynamic-storage-master-v1]
    paths: [.github/workflows/tmp-dynamic-storage.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-storage-master-v1
      - name: Patch storage integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch(path, old, new, count=1):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              s=s.replace(old,new,count)
              p.write_text(s)

          # Master UI: same-type sounding reuse is explicit but still easy.
          patch('master-storage.html',
              '<div class="quick-note"><b>Mode cepat:</b> untuk storage baru cukup isi <b>Code Storage</b>. Sistem otomatis menentukan jenis, kapasitas standar, profil tera, status aktif, dan urutan tampil. Isi WH/Lokasi hanya bila perlu.</div>',
              '<div class="quick-note"><b>Mode cepat:</b> cukup isi <b>Code Storage</b>. MT baru otomatis memakai profil sounding/tera MT, FT baru memakai profil sounding/tera FT. Gunakan ini bila bentuk/tipe tangkinya sama. Kalau fisiknya berbeda, buka <b>Pengaturan lanjutan</b> lalu pilih <b>Belum ada tera</b>. WH/Lokasi tetap opsional.</div>')
          patch('master-storage.html',
              '<div><label>Profil Tera</label><select id="teraProfile"><option value="">Belum ada tera</option><option value="MT">Tera MT</option><option value="FT">Tera FT</option></select></div>',
              '<div><label>Profil Sonding / Tera</label><select id="teraProfile"><option value="">Belum ada / fisik berbeda</option><option value="MT">Pakai sondingan tipe MT yang sama</option><option value="FT">Pakai sondingan tipe FT yang sama</option></select></div>')

          # Stock: registry from Master MT/FT, selectors dynamic, sounding via profile.
          patch('stock.html', '<script src="auth.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>', '<script src="auth.js"></script>\n<script src="storage-master.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>')
          patch('stock.html',
              'const STORAGES=["MT01","MT02","MT03","MT04","FT0073","FT0075"];\n\nconst STORAGE_CAPACITY={...TERA.nominalCapacity};\n\nconst STORAGE_HARD_CAPACITY=Object.fromEntries(\n    STORAGES.map(storage=>{\n        const curveName=TERA.storageCurve[storage];\n        const curve=TERA.curves[curveName];\n        return [storage,Number(curve[curve.length-1])];\n    })\n);',
              'let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet STORAGES=STORAGE_ROWS.map(row=>row.code);\nlet STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\nlet STORAGE_HARD_CAPACITY=window.KPPStorage.hardCapacityMap(TERA,STORAGE_ROWS);')
          patch('stock.html', 'const TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);', 'let TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);')
          patch('stock.html',
              'function capacity(storage){\n    return n(STORAGE_CAPACITY[storage]);\n}',
              'function storageRow(storage){return window.KPPStorage.byCode(STORAGE_ROWS,storage);}\nfunction storageLabel(storage){return window.KPPStorage.label(storageRow(storage)||{code:storage});}\nfunction teraLookup(storage,height){return window.KPPStorage.lookup(TERA,STORAGE_ROWS,storage,height);}\nfunction teraHeightForLiters(storage,liters){return window.KPPStorage.heightForLiters(TERA,STORAGE_ROWS,storage,liters);}\n\nfunction capacity(storage){\n    return n(STORAGE_CAPACITY[storage]);\n}')
          patch('stock.html',
              'option.textContent=\n            storage+\n            (storage==="FT0073"?" (WH FT02)":\n             storage==="FT0075"?" (WH FT01)":"");',
              'option.textContent=storageLabel(storage);', 2)
          patch('stock.html',
              '        let suffix="";\n        if(storage==="FT0073") suffix=" / WH FT02";\n        if(storage==="FT0075") suffix=" / WH FT01";',
              '        const row=storageRow(storage);\n        const suffix=row?.warehouse ? " / "+row.warehouse : "";')
          patch('stock.html', 'const estimatedHeight=TERA.heightForLiters(\n            storage,\n            Math.max(0,n(stock[storage]))\n        );', 'const estimatedHeight=teraHeightForLiters(\n            storage,\n            Math.max(0,n(stock[storage]))\n        );')
          patch('stock.html', 'return TERA.lookup(storage,input.value);', 'return teraLookup(storage,input.value);')
          patch('stock.html', 'closingTera=TERA.lookup(storage,heightInput.value);', 'closingTera=teraLookup(storage,heightInput.value);')
          patch('stock.html',
              'function sourceFromFuel(row){\n    const ft=String(row.fuel_truck||"").toUpperCase();\n    if(ft==="FT0073"||ft==="FT0075") return ft;\n\n    const wh=String(row.wh||"").toUpperCase();\n    if(wh==="FT02") return "FT0073";\n    if(wh==="FT01") return "FT0075";\n    return "";\n}',
              'function sourceFromFuel(row){\n    const ft=String(row.fuel_truck||"").trim().toUpperCase();\n    const direct=STORAGE_ROWS.find(item=>item.storage_type==="FT" && item.code===ft);\n    if(direct)return direct.code;\n    const wh=window.KPPStorage.normalizeWarehouse(row.wh);\n    const match=STORAGE_ROWS.find(item=>item.storage_type==="FT" && window.KPPStorage.whCode(item)===wh);\n    return match?.code||"";\n}')
          patch('stock.html',
              'const openingStorage=document.getElementById("openingStorage");\n\nSTORAGES.forEach(storage=>{\n    const option=document.createElement("option");\n    option.value=storage;\n    option.textContent=\n        storage+\n        (storage==="FT0073"?" (WH FT02)":\n         storage==="FT0075"?" (WH FT01)":"");\n    openingStorage.appendChild(option);\n});',
              'function refreshStorageInputs(){\n    ["converterStorage","openingStorage","receiptDestination","transferSource","transferDestination"].forEach(id=>fillStorageSelect(id,false));\n    fillStorageSelect("editSource",true);\n    fillStorageSelect("editDestination",false);\n    syncTransferDestination();\n    updateQuickConverter();\n    updateOpeningConversion();\n    updateReceiptCalculation();\n}\n\nasync function loadStorageMaster(){\n    STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:true});\n    STORAGES=STORAGE_ROWS.map(row=>row.code);\n    STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\n    STORAGE_HARD_CAPACITY=window.KPPStorage.hardCapacityMap(TERA,STORAGE_ROWS);\n    TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+n(b),0);\n    CURRENT_SYSTEM_STOCK=Object.fromEntries(STORAGES.map(storage=>[storage,0]));\n    refreshStorageInputs();\n}')
          patch('stock.html',
              '    await loadTransporterOptions();\n\n    if(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman")',
              '    await loadStorageMaster();\n    await loadTransporterOptions();\n\n    if(CURRENT_PROFILE && CURRENT_PROFILE.role==="fuelman")')
          for id_ in ['converterStorage','receiptDestination','transferSource','transferDestination']:
              p=Path('stock.html'); s=p.read_text()
              pattern=rf'(<select id="{id_}"[^>]*>)(.*?)(</select>)'
              repl=rf'\1<option value="">Memuat Master MT / FT...</option>\3'
              s2,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'failed select patch {id_}: {n}')
              p.write_text(s2)

          # Daily report: dynamic storage, capacity, FT distribution and ready-copy text.
          patch('daily-report.html', '<script src="auth.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>', '<script src="auth.js"></script>\n<script src="storage-master.js"></script>\n<script src="tera-data_v1_aug2026.js"></script>')
          patch('daily-report.html',
              'const STORAGES=["MT01","MT02","MT03","MT04","FT0073","FT0075"];\nconst FT_MAP={\n  FT0073:"FT02",\n  FT0075:"FT01"\n};\n\nconst STORAGE_CAPACITY={\n  MT01:40000,\n  MT02:40000,\n  MT03:40000,\n  MT04:40000,\n  FT0073:20000,\n  FT0075:20000\n};\nconst TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);',
              'let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet STORAGES=STORAGE_ROWS.map(row=>row.code);\nlet FT_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);\nlet STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\nlet TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);\nasync function loadStorageMaster(){\n  STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:true});\n  STORAGES=STORAGE_ROWS.map(row=>row.code);\n  FT_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);\n  STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\n  TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+n(b),0);\n}')
          patch('daily-report.html',
              'function estimatedSonding(storage,qty){\n  if(!TERA || typeof TERA.heightForLiters!=="function")return null;\n  return TERA.heightForLiters(storage,Math.max(0,n(qty)));\n}',
              'function estimatedSonding(storage,qty){\n  if(!TERA)return null;\n  try{return window.KPPStorage.heightForLiters(TERA,STORAGE_ROWS,storage,Math.max(0,n(qty)));}\n  catch{return null;}\n}')
          patch('daily-report.html',
              'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  if(ft==="FT0073"||ft==="FT0075")return ft;\n  const wh=String(row.wh||"").trim().toUpperCase();\n  if(wh==="FT02")return "FT0073";\n  if(wh==="FT01")return "FT0075";\n  return "";\n}',
              'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  const direct=STORAGE_ROWS.find(item=>item.storage_type==="FT" && item.code===ft);\n  if(direct)return direct.code;\n  const wh=window.KPPStorage.normalizeWarehouse(row.wh);\n  const match=STORAGE_ROWS.find(item=>item.storage_type==="FT" && window.KPPStorage.whCode(item)===wh);\n  return match?.code||"";\n}')
          patch('daily-report.html',
              '  const result={\n    FT0073:{1:0,2:0},\n    FT0075:{1:0,2:0}\n  };',
              '  const result=Object.fromEntries(\n    STORAGE_ROWS.filter(row=>row.storage_type==="FT").map(row=>[row.code,{1:0,2:0}])\n  );')
          patch('daily-report.html',
              '  ["FT0073","FT0075"].forEach(ft=>{\n    const s1=n(summary[ft][1]);\n    const s2=n(summary[ft][2]);',
              '  STORAGE_ROWS.filter(row=>row.storage_type==="FT").forEach(row=>{\n    const ft=row.code;\n    const s1=n(summary[ft]?.[1]);\n    const s2=n(summary[ft]?.[2]);')
          p=Path('daily-report.html'); s=p.read_text()
          pattern=r'function makeReportText\(\{[\s\S]*?\n\}\n\nasync function loadReport\(\)\{'
          replacement='''function makeReportText({\n  reportDate,stock,totalStock,yesterday,ySummary,\n  usageYesterday,usageMTD,avgMTD,ito,activeDays\n}){\n  const stockLines=STORAGE_ROWS.map(row=>{\n    const label=row.warehouse ? `${row.code} / ${row.warehouse}` : row.code;\n    return stockReportLine(label,row.code,stock[row.code]);\n  }).join("\\n");\n  const usageLines=STORAGE_ROWS.filter(row=>row.storage_type==="FT").map(row=>{\n    const summary=ySummary[row.code]||{1:0,2:0};\n    return `${row.code}${row.warehouse?` / ${row.warehouse}`:""}\\nShift 1 : ${fmt(summary[1])} LTR\\nShift 2 : ${fmt(summary[2])} LTR`;\n  }).join("\\n\\n");\n  return `UPDATE STOCK FUEL\n${formatDateID(reportDate)}\n\n${stockLines}\n\nTOTAL STOCK FUEL = ${fmt(totalStock)} LTR\n\nUSAGE YESTERDAY (${formatDateID(yesterday)}):\n${usageLines}\n\nTOTAL PEMAKAIAN = ${fmt(usageYesterday)} LTR\n\nUSAGE MTD = ${fmt(usageMTD)} LTR\nAVG MTD = ${fmt(avgMTD)} LTR/HARI (${activeDays} hari aktif)\nITO = ${fmtIto(ito)} HARI`;\n}\n\nasync function loadReport(){'''
          s2,n=re.subn(pattern,replacement,s,count=1)
          if n!=1: raise SystemExit(f'failed makeReportText patch: {n}')
          p.write_text(s2)
          patch('daily-report.html',
              'document.addEventListener("kpp-auth-ready",()=>{\n  document.getElementById("reportDate").value=localDate();\n  loadReport();\n});',
              'document.addEventListener("kpp-auth-ready",async()=>{\n  document.getElementById("reportDate").value=localDate();\n  await loadStorageMaster();\n  loadReport();\n});')

          # Dashboard: dynamic storage/capacity and FT-WH mapping.
          patch('dashboard.html', '<script src="auth.js"></script>', '<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          patch('dashboard.html',
              'const STORAGES=["MT01","MT02","MT03","MT04","FT0073","FT0075"];\nconst STORAGE_CAPACITY={MT01:40000,MT02:40000,MT03:40000,MT04:40000,FT0073:20000,FT0075:20000};\nconst TOTAL_CAPACITY=200000;',
              'let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet STORAGES=STORAGE_ROWS.map(row=>row.code);\nlet STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\nlet TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+b,0);\nasync function loadStorageMaster(){\n  STORAGE_ROWS=await window.KPPStorage.load(db,{activeOnly:true});\n  STORAGES=STORAGE_ROWS.map(row=>row.code);\n  STORAGE_CAPACITY=window.KPPStorage.capacityMap(STORAGE_ROWS);\n  TOTAL_CAPACITY=Object.values(STORAGE_CAPACITY).reduce((a,b)=>a+n(b),0);\n}')
          patch('dashboard.html',
              'function getFuelTruck(item){\n  const ft=String(item.fuel_truck||"").trim().toUpperCase();\n  if(ft)return ft;\n  const wh=String(item.wh||"").trim().toUpperCase();\n  if(wh==="FT02")return "FT0073";\n  if(wh==="FT01")return "FT0075";\n  return "-";\n}\nfunction getWH(item){\n  const wh=String(item.wh||"").trim().toUpperCase();\n  if(wh)return wh;\n  const ft=getFuelTruck(item);\n  if(ft==="FT0073")return "FT02";\n  if(ft==="FT0075")return "FT01";\n  return "-";\n}',
              'function getFuelTruck(item){\n  const ft=String(item.fuel_truck||"").trim().toUpperCase();\n  if(ft)return ft;\n  const wh=window.KPPStorage.normalizeWarehouse(item.wh);\n  const match=STORAGE_ROWS.find(row=>row.storage_type==="FT" && window.KPPStorage.whCode(row)===wh);\n  return match?.code||"-";\n}\nfunction getWH(item){\n  const wh=window.KPPStorage.normalizeWarehouse(item.wh);\n  if(wh)return wh;\n  const ft=getFuelTruck(item);\n  const row=STORAGE_ROWS.find(item=>item.code===ft);\n  return row?window.KPPStorage.whCode(row)||"-":"-";\n}')
          patch('dashboard.html',
              'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  if(ft==="FT0073"||ft==="FT0075")return ft;\n  const wh=String(row.wh||"").trim().toUpperCase();\n  if(wh==="FT02")return "FT0073";\n  if(wh==="FT01")return "FT0075";\n  return "";\n}',
              'function sourceFromFuel(row){\n  const ft=String(row.fuel_truck||"").trim().toUpperCase();\n  const direct=STORAGE_ROWS.find(item=>item.storage_type==="FT" && item.code===ft);\n  if(direct)return direct.code;\n  const wh=window.KPPStorage.normalizeWarehouse(row.wh);\n  const match=STORAGE_ROWS.find(item=>item.storage_type==="FT" && window.KPPStorage.whCode(item)===wh);\n  return match?.code||"";\n}')
          p=Path('dashboard.html'); s=p.read_text()
          marker='document.addEventListener("kpp-auth-ready",async()=>{'
          if marker in s:
              s=s.replace(marker,marker+'\n  await loadStorageMaster();',1)
          else:
              marker='document.addEventListener("kpp-auth-ready",()=>{'
              if marker not in s: raise SystemExit('dashboard auth ready pattern not found')
              s=s.replace(marker,'document.addEventListener("kpp-auth-ready",async()=>{\n  await loadStorageMaster();',1)
          p.write_text(s)

          # Fuelman: active FT list from master.
          patch('fuelman.html', '<script src="auth.js"></script>', '<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          p=Path('fuelman.html'); s=p.read_text()
          pattern=r'(<select id="fuelTruck">)(.*?)(</select>)'
          s2,n=re.subn(pattern,r'\1<option value="">-- Pilih Fuel Truck --</option>\3',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('fuelman select patch failed')
          p.write_text(s2)
          patch('fuelman.html',
              'let currentProfile=null;\nlet currentSession=null;',
              'let currentProfile=null;\nlet currentSession=null;\nlet STORAGE_ROWS=window.KPPStorage.fallbackRows();\nasync function loadFuelTruckMaster(){\n  STORAGE_ROWS=await window.KPPStorage.load(KPP.db,{activeOnly:true});\n  const rows=STORAGE_ROWS.filter(row=>row.storage_type==="FT");\n  const select=document.getElementById("fuelTruck");\n  select.innerHTML=\'<option value="">-- Pilih Fuel Truck --</option>\'+rows.map(row=>`<option value="${row.code}">${window.KPPStorage.label(row)}</option>`).join("");\n}')
          patch('fuelman.html',
              '  currentProfile=e.detail.profile;\n  await loadActiveSession();',
              '  currentProfile=e.detail.profile;\n  await loadFuelTruckMaster();\n  await loadActiveSession();')

          # Pengisian: dynamic FT list and dynamic warehouse mapping.
          patch('pengisian.html', '<script src="auth.js"></script>', '<script src="auth.js"></script>\n<script src="storage-master.js"></script>')
          p=Path('pengisian.html'); s=p.read_text()
          pattern=r'(<select id="fuelTruck">)(.*?)(</select>)'
          s2,n=re.subn(pattern,r'\1<option value="">-- Pilih Fuel Truck --</option>\3',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('pengisian select patch failed')
          p.write_text(s2)
          patch('pengisian.html',
              'const FUEL_TRUCK_MAP = {\n    "FT0073": "FT02",\n    "FT0075": "FT01"\n};',
              'let STORAGE_ROWS=window.KPPStorage.fallbackRows();\nlet FUEL_TRUCK_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);\nasync function loadFuelTruckMaster(){\n    STORAGE_ROWS=await window.KPPStorage.load(supabaseClient,{activeOnly:true});\n    FUEL_TRUCK_MAP=window.KPPStorage.ftMap(STORAGE_ROWS);\n    const select=document.getElementById("fuelTruck");\n    const selected=select.value;\n    const rows=STORAGE_ROWS.filter(row=>row.storage_type==="FT");\n    select.innerHTML=\'<option value="">-- Pilih Fuel Truck --</option>\'+rows.map(row=>`<option value="${row.code}">${window.KPPStorage.label(row)}</option>`).join("");\n    if(selected && rows.some(row=>row.code===selected))select.value=selected;\n}')
          p=Path('pengisian.html'); s=p.read_text()
          marker='document.addEventListener("kpp-auth-ready",async'
          idx=s.find(marker)
          if idx<0: raise SystemExit('pengisian auth ready not found')
          brace=s.find('{',idx)
          s=s[:brace+1]+'\n    await loadFuelTruckMaster();'+s[brace+1:]
          p.write_text(s)

          # Static regression checks.
          p=Path('scripts/check-static.mjs'); s=p.read_text()
          anchor='const dashboardPath = path.join(projectRoot, "dashboard.html");'
          extra='''const storageHelperPath = path.join(projectRoot, "storage-master.js");\nconst storageHelperSource = fs.readFileSync(storageHelperPath, "utf8");\nif (!storageHelperSource.includes("storage_master") || !storageHelperSource.includes("hardCapacityMap")) {\n  fail(storageHelperPath, "helper Master MT/FT dinamis tidak lengkap");\n}\nif (!stockSource.includes("loadStorageMaster") || !stockSource.includes("teraLookup")) {\n  fail(stockPath, "Stock belum memakai Master MT/FT dan profil sounding dinamis");\n}\n\n'''
          if anchor not in s: raise SystemExit('static check anchor missing')
          s=s.replace(anchor,extra+anchor,1)
          p.write_text(s)

          Path('.github/workflows/tmp-dynamic-storage.yml').unlink()
          PY
          git config user.name "kpp-storage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make Master MT FT the dynamic storage source"
          git push origin HEAD:feat/dynamic-storage-master-v1
