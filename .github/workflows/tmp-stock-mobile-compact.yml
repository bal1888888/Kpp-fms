name: Temp Stock Mobile Compact
on:
  push:
    branches:
      - feat/stock-mobile-compact-v1
    paths:
      - .github/workflows/tmp-stock-mobile-compact.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stock-mobile-compact-v1
          fetch-depth: 0
      - name: Apply Stock mobile patch
        run: python3 scripts/patch-stock-mobile-compact.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run checks
        run: npm run check
      - name: Remove temporary patch files
        run: rm -f scripts/patch-stock-mobile-compact.py .github/workflows/tmp-stock-mobile-compact.yml
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.html package.json scripts/test-stock-mobile-workflow-collapse.mjs scripts/patch-stock-mobile-compact.py .github/workflows/tmp-stock-mobile-compact.yml
          git commit -m "feat: ringkas workflow Stock di HP" || exit 0
          git push origin HEAD:feat/stock-mobile-compact-v1
