name: UAT session edge hardening

on:
  push:
    branches:
      - hardening/uat-session-edge-v1

permissions:
  contents: write

concurrency:
  group: uat-session-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/uat-session-edge-v1
          fetch-depth: 0
      - name: Apply UAT session edge guards
        run: python scripts/apply-uat-session-edge.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "hardening: lock stale Fuelman sessions at shift rollover"
          git push origin HEAD:hardening/uat-session-edge-v1
