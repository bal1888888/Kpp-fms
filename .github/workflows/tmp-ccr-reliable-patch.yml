name: Temp CCR reliable allocation patch

on:
  push:
    branches:
      - fix/ccr-allocation-idempotent-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ccr-allocation-idempotent-v3
          fetch-depth: 0

      - name: Patch CCR submit path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ccr.html')
          text = path.read_text(encoding='utf-8')

          anchor = '''let HM_REFERENCE_REQUEST=0;
          let HM_REFERENCE_LOADING=false;
          '''
          helper = '''let HM_REFERENCE_REQUEST=0;
          let HM_REFERENCE_LOADING=false;
          const CCR_PENDING_KEY_PREFIX="kpp-ccr-allocation-pending-v1:";

          function ccrPendingKey(){
            const uid=window.KPP_SESSION?.user?.id;
            if(!uid)throw new Error("Sesi login belum siap. Muat ulang halaman.");
            return CCR_PENDING_KEY_PREFIX+uid;
          }
          function readCcrAllocationPending(){
            const raw=localStorage.getItem(ccrPendingKey());
            if(!raw)return null;
            try{
              const parsed=JSON.parse(raw);
              if(!parsed?.id||!parsed?.recordedAt||!parsed?.payload)throw new Error("format");
              return parsed;
            }catch(_){
              throw new Error("Status pengiriman jatah di perangkat rusak. Hubungi Admin sebelum input baru.");
            }
          }
          async function submitCcrAllocationReliable(payload=null){
            let pending=readCcrAllocationPending();
            if(!pending){
              if(!payload)return {data:null,error:null};
              if(!globalThis.crypto?.randomUUID){
                return {data:null,error:new Error("Browser belum mendukung ID pengiriman aman. Gunakan Chrome/Edge terbaru.")};
              }
              pending={id:crypto.randomUUID(),recordedAt:new Date().toISOString(),payload};
              try{
                localStorage.setItem(ccrPendingKey(),JSON.stringify(pending));
              }catch(e){
                return {data:null,error:new Error("Penyimpanan perangkat tidak tersedia. Jatah tidak dikirim agar aman dari double submit.")};
              }
            }

            const result=await db.rpc("create_ccr_allocation_reliable",{
              p_request_id:pending.id,
              p_payload:pending.payload,
              p_recorded_at:pending.recordedAt
            });

            if(result.error){
              return {data:null,error:new Error("Hasil belum terkonfirmasi. Tekan SIMPAN JATAH lagi untuk cek/kirim ulang. "+result.error.message)};
            }
            if(!result.data?.ok){
              localStorage.removeItem(ccrPendingKey());
              return {data:null,error:new Error(result.data?.message||"Server menolak pengiriman jatah.")};
            }

            localStorage.removeItem(ccrPendingKey());
            return {data:result.data.data,error:null,replayed:!!result.data.replayed};
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'constant anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper, 1)

          start = '''  try{
              if(CURRENT_OPERATOR_CHECKIN){
          '''
          recovered = '''  try{
              const pendingBeforeInput=readCcrAllocationPending();
              if(pendingBeforeInput){
                status.textContent="Memeriksa pengiriman jatah sebelumnya...";
                const recovered=await submitCcrAllocationReliable();
                if(recovered.error)throw recovered.error;
                const row=recovered.data;
                alert(`✅ Jatah ${row?.unit||""} pengisian ke-${row?.filling_no||"-"} sudah terkonfirmasi di server.`);
                location.reload();
                return;
              }
              if(CURRENT_OPERATOR_CHECKIN){
          '''
          if text.count(start) != 1:
              raise SystemExit(f'save start anchor count={text.count(start)}')
          text = text.replace(start, recovered, 1)

          direct = '''    const {data,error}=await db
                .from("ccr_allocations")
                .insert(payload)
                .select("*")
                .single();
          '''
          reliable = '''    const {data,error}=await submitCcrAllocationReliable(payload);
          '''
          if text.count(direct) != 1:
              raise SystemExit(f'direct insert anchor count={text.count(direct)}')
          text = text.replace(direct, reliable, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/tmp-ccr-reliable-patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ccr.html .github/workflows/tmp-ccr-reliable-patch.yml
          git diff --cached --check
          git commit -m "fix: make CCR allocation submit retry-safe"
          git push origin HEAD:fix/ccr-allocation-idempotent-v3
