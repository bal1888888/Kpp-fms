name: Master capacity completion patch

on:
  push:
    branches:
      - feat/master-unit-capacity-completion-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Master Unit capacity completion UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('hm-master.html')
          src=path.read_text()

          def once(old,new,label):
              global src
              if old not in src:
                  raise SystemExit(f'anchor not found: {label}')
              src=src.replace(old,new,1)

          once(
              '.master-toolbar{display:grid;grid-template-columns:minmax(240px,1.7fr) repeat(3,minmax(130px,.65fr));gap:10px;align-items:stretch;margin-bottom:13px}',
              '.master-toolbar{display:grid;grid-template-columns:minmax(240px,1.7fr) repeat(4,minmax(120px,.65fr));gap:10px;align-items:stretch;margin-bottom:13px}',
              'master toolbar columns'
          )
          once(
              '.qr-toolbar{display:grid;grid-template-columns:1.35fr 1fr auto auto;gap:10px;align-items:end;margin-bottom:10px}',
              '.qr-toolbar{display:grid;grid-template-columns:1.25fr 1.05fr 1fr auto auto;gap:10px;align-items:end;margin-bottom:10px}',
              'qr toolbar columns'
          )
          once(
              '.qr-selected-note{background:var(--violet-soft);border:1px solid #ddd6fe;color:#5b21b6;margin-top:10px}',
              '.qr-selected-note{background:var(--violet-soft);border:1px solid #ddd6fe;color:#5b21b6;margin-top:10px}\n.capacity-missing-card{background:var(--amber-soft)!important;border-color:#fde68a!important}\n.capacity-missing-card strong{color:#b45309!important}',
              'capacity card style'
          )

          once(
              '''                <div class="card">\n                    <small>QR SUDAH DIBUAT</small>\n                    <strong id="totalQrGenerated">0</strong>\n                </div>''',
              '''                <div class="card">\n                    <small>QR SUDAH DIBUAT</small>\n                    <strong id="totalQrGenerated">0</strong>\n                </div>\n                <div class="card capacity-missing-card">\n                    <small>KAPASITAS BELUM DIISI</small>\n                    <strong id="totalCapacityMissing">0</strong>\n                </div>''',
              'capacity missing summary card'
          )

          once(
              '''                <div>\n                    <label>Pilih QR</label>\n                    <select id="qrQuickSelect">''',
              '''                <div>\n                    <label>Filter Kapasitas</label>\n                    <select id="capacityFilter" onchange="renderUnitTable()">\n                        <option value="all">SEMUA KAPASITAS</option>\n                        <option value="missing">BELUM DIISI • UNIT AKTIF</option>\n                        <option value="ready">SUDAH DIISI</option>\n                    </select>\n                </div>\n                <div>\n                    <label>Pilih QR</label>\n                    <select id="qrQuickSelect">''',
              'capacity filter control'
          )

          once(
              '''function getFilteredUnitRows(){\n    const q=normalizeUnit(document.getElementById("unitSearch")?.value||"");\n    const qrMode=document.getElementById("qrFilter")?.value||"all";''',
              '''function getFilteredUnitRows(){\n    const q=normalizeUnit(document.getElementById("unitSearch")?.value||"");\n    const qrMode=document.getElementById("qrFilter")?.value||"all";\n    const capacityMode=document.getElementById("capacityFilter")?.value||"all";''',
              'capacity filter state'
          )

          once(
              '''        const qrOk=\n            qrMode==="all" ||\n            (qrMode==="yes" && row.qr_generated) ||\n            (qrMode==="no" && !row.qr_generated);\n\n        return searchOk && qrOk;''',
              '''        const qrOk=\n            qrMode==="all" ||\n            (qrMode==="yes" && row.qr_generated) ||\n            (qrMode==="no" && !row.qr_generated);\n\n        const hasCapacity=\n            Number.isFinite(Number(row.tank_capacity_liter)) &&\n            Number(row.tank_capacity_liter)>0;\n\n        const capacityOk=\n            capacityMode==="all" ||\n            (capacityMode==="missing" && row.active && !hasCapacity) ||\n            (capacityMode==="ready" && hasCapacity);\n\n        return searchOk && qrOk && capacityOk;''',
              'capacity filter predicate'
          )

          once(
              '''    document.getElementById("totalQrGenerated").textContent=\n        UNIT_MASTER_ROWS.filter(r=>r.qr_generated).length;''',
              '''    document.getElementById("totalQrGenerated").textContent=\n        UNIT_MASTER_ROWS.filter(r=>r.qr_generated).length;\n\n    document.getElementById("totalCapacityMissing").textContent=\n        UNIT_MASTER_ROWS.filter(r=>\n            r.active &&\n            !(Number.isFinite(Number(r.tank_capacity_liter)) && Number(r.tank_capacity_liter)>0)\n        ).length;''',
              'capacity missing count'
          )

          path.write_text(src)

          test=Path('scripts/test-master-capacity-completion.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst src=fs.readFileSync(new URL("../hm-master.html",import.meta.url),"utf8");\n\ntest("Master Unit surfaces capacity completion state",()=>{\n  assert.match(src,/id="totalCapacityMissing"/);\n  assert.match(src,/id="capacityFilter"/);\n  assert.match(src,/value="missing">BELUM DIISI/);\n  assert.match(src,/value="ready">SUDAH DIISI/);\n});\n\ntest("Capacity filter only flags active units without configured capacity",()=>{\n  assert.match(src,/capacityMode===?"missing"/);\n  assert.match(src,/row\.active && !hasCapacity/);\n  assert.match(src,/capacityMode===?"ready"/);\n  assert.match(src,/totalCapacityMissing/);\n});\n''')

          pkg=Path('package.json')
          p=pkg.read_text()
          old='scripts/test-heavy-page-query-hardening.mjs && node --test scripts/test-dashboard-premium-radial.mjs'
          new='scripts/test-heavy-page-query-hardening.mjs scripts/test-master-capacity-completion.mjs && node --test scripts/test-dashboard-premium-radial.mjs'
          if old not in p:
              raise SystemExit('package check anchor not found')
          pkg.write_text(p.replace(old,new,1))

          workflow=Path('.github/workflows/master-capacity-completion-autopatch.yml')
          workflow.unlink()
          PY

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run full repository checks
        run: npm run check

      - name: Commit capacity completion UX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show unit capacity completion status"
          git push origin HEAD
