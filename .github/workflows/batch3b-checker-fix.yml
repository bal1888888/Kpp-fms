name: Batch 3B checker fix

on:
  push:
    branches:
      - "hardening/batch3b-wib-web-v1"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/batch3b-wib-web-v1
      - name: Update static checker for versioned local assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-static.mjs')
          s=p.read_text(encoding='utf-8')
          old="if (!dynamicSource.includes('src=\"storage-master.js\"')) {"
          new="if (!/src=[\\\"']storage-master\\.js(?:\\?v=[^\\\"']*)?[\\\"']/.test(dynamicSource)) {"
          if old not in s:
              if new not in s:
                  raise SystemExit('storage-master checker anchor not found')
          else:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/batch3b-checker-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: accept versioned storage master asset" || exit 0
          git push origin HEAD:hardening/batch3b-wib-web-v1
