name: Batch 3C rendering hardening

on:
  push:
    branches:
      - "hardening/batch3c-rendering-safety-v1"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/batch3c-rendering-safety-v1
          fetch-depth: 0

      - name: Harden dynamic rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected 1 anchor, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once(
              'stock.html',
              '''            banner.innerHTML="[PERINGATAN] Stock menipis: "+critical.join("  |  ")+". Rencanakan penerimaan / transfer.";''',
              '''            banner.textContent="[PERINGATAN] Stock menipis: "+critical.join("  |  ")+". Rencanakan penerimaan / transfer.";'''
          )
          replace_once(
              'stock.html',
              '''            banner.innerHTML="[INFO] Stock mendekati penuh: "+high.join("  |  ")+". Cek kapasitas sebelum penerimaan / transfer.";''',
              '''            banner.textContent="[INFO] Stock mendekati penuh: "+high.join("  |  ")+". Cek kapasitas sebelum penerimaan / transfer.";'''
          )

          replace_once(
              'pengisian.html',
              '''    select.innerHTML='<option value="">-- Pilih Fuel Truck --</option>'+rows.map(row=>`<option value="${row.code}">${window.KPPStorage.label(row)}</option>`).join("");
          if(selected && rows.some(row=>row.code===selected))select.value=selected;''',
              '''    select.replaceChildren();
          const placeholder=document.createElement("option");
          placeholder.value="";
          placeholder.textContent="-- Pilih Fuel Truck --";
          select.appendChild(placeholder);
          rows.forEach(row=>{
              const option=document.createElement("option");
              option.value=String(row.code||"");
              option.textContent=window.KPPStorage.label(row);
              select.appendChild(option);
          });
          if(selected && rows.some(row=>row.code===selected))select.value=selected;'''
          )

          replace_once(
              'dashboard.html',
              '''return `<div class="receipt-row"><div class="receipt-company">${company}</div><div class="receipt-track"><div class="receipt-fill" style="width:${width}%"></div></div><div class="receipt-value">${formatAngka(qty)} L</div></div>`;''',
              '''return `<div class="receipt-row"><div class="receipt-company">${escapeHtml(company)}</div><div class="receipt-track"><div class="receipt-fill" style="width:${width}%"></div></div><div class="receipt-value">${formatAngka(qty)} L</div></div>`;'''
          )

          replace_once(
              'hm-master.html',
              '''    if(error){body.innerHTML=`<tr><td colspan="6">${error.message}</td></tr>`;return}
          if(!data?.length){body.innerHTML='<tr><td colspan="6">Belum ada koreksi HM untuk unit ini.</td></tr>';return}
          body.innerHTML=data.map(r=>`<tr><td>${r.tanggal}</td><td>${String(r.jam).slice(0,8)}</td><td>${r.unit}</td><td>${fmt(r.hm)}</td><td>${r.operator||"-"}</td><td>${r.note||"-"}</td></tr>`).join("");''',
              '''    if(error){body.innerHTML=`<tr><td colspan="6">${esc(error.message)}</td></tr>`;return}
          if(!data?.length){body.innerHTML='<tr><td colspan="6">Belum ada koreksi HM untuk unit ini.</td></tr>';return}
          body.innerHTML=data.map(r=>`<tr><td>${esc(r.tanggal)}</td><td>${esc(String(r.jam||"").slice(0,8))}</td><td>${esc(r.unit)}</td><td>${fmt(r.hm)}</td><td>${esc(r.operator||"-")}</td><td>${esc(r.note||"-")}</td></tr>`).join("");'''
          )

          test=Path('scripts/test-rendering-safety.mjs')
          test.write_text(textwrap.dedent(r'''
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const read=(name)=>fs.readFileSync(new URL(`../${name}`,import.meta.url),"utf8");

          test("stock alert renders dynamic content as text",()=>{
            const src=read("stock.html");
            assert.match(src,/banner\.textContent="\[PERINGATAN\] Stock menipis:/);
            assert.match(src,/banner\.textContent="\[INFO\] Stock mendekati penuh:/);
            assert.doesNotMatch(src,/banner\.innerHTML="\[(?:PERINGATAN|INFO)\]/);
          });

          test("pengisian fuel-truck options use DOM textContent",()=>{
            const src=read("pengisian.html");
            assert.match(src,/option\.textContent=window\.KPPStorage\.label\(row\)/);
            assert.match(src,/select\.replaceChildren\(\)/);
            assert.doesNotMatch(src,/rows\.map\(row=>`<option value="\$\{row\.code\}/);
          });

          test("dashboard escapes transporter names before HTML rendering",()=>{
            const src=read("dashboard.html");
            assert.match(src,/receipt-company">\$\{escapeHtml\(company\)\}/);
            assert.doesNotMatch(src,/receipt-company">\$\{company\}/);
          });

          test("HM correction history escapes database free text",()=>{
            const src=read("hm-master.html");
            assert.match(src,/\$\{esc\(error\.message\)\}/);
            assert.match(src,/\$\{esc\(r\.operator\|\|"-"\)\}/);
            assert.match(src,/\$\{esc\(r\.note\|\|"-"\)\}/);
            assert.doesNotMatch(src,/\$\{r\.note\|\|"-"\}/);
          });
          ''').lstrip(),encoding='utf-8')

          package=Path('package.json')
          text=package.read_text(encoding='utf-8')
          old='scripts/test-wib-runtime.mjs scripts/test-riwayat-pagination.mjs && node --test scripts/test-dashboard-premium-radial.mjs'
          new='scripts/test-wib-runtime.mjs scripts/test-riwayat-pagination.mjs scripts/test-rendering-safety.mjs && node --test scripts/test-dashboard-premium-radial.mjs'
          if text.count(old)!=1:
              raise RuntimeError('package.json check anchor missing')
          package.write_text(text.replace(old,new,1),encoding='utf-8')

          Path('.github/workflows/batch3c-autopatch.yml').unlink()
          PY

      - name: Run full repository checks
        run: npm ci --ignore-scripts && npm run check

      - name: Commit Batch 3C
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "hardening: escape dynamic frontend rendering"
          git push origin HEAD:hardening/batch3c-rendering-safety-v1
