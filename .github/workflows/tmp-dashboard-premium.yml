name: Temp dashboard premium radial

on:
  push:
    branches:
      - ui/dashboard-radial-premium-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dashboard-radial-premium-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply dashboard premium patch
        run: python scripts/tmp_dashboard_premium.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: premiumkan radial pemakaian dan stock dashboard"
          git push origin HEAD:ui/dashboard-radial-premium-v1
