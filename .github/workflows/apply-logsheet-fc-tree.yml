name: Apply Logsheet FC EGI Tree
on:
  push:
    branches: [feat/fc-egi-grouping-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Logsheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('logsheet.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="fc-egi-tree-logsheet.js?v=20260917"></script>'
          if tag not in s:
              marker='<script src="fc-chart.js?v=20260912h"></script>'
              if marker not in s:
                  raise SystemExit('fc-chart script marker not found')
              s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/apply-logsheet-fc-tree.yml').unlink(missing_ok=True)
          PY
      - name: Commit patched Logsheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logsheet.html .github/workflows/apply-logsheet-fc-tree.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable EGI tree picker on Logsheet [skip ci]"
          git push
