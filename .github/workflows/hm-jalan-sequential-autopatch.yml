name: HM Jalan sequential patch

on:
  push:
    branches:
      - fix/logsheet-hm-jalan-sequential-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/logsheet-hm-jalan-sequential-v1
      - name: Apply HM Jalan fix
        run: python scripts/apply-hm-jalan-sequential-fix.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary autopatch files
        run: |
          rm -f scripts/apply-hm-jalan-sequential-fix.py
          rm -f .github/workflows/hm-jalan-sequential-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: hitung HM Jalan dari HM transaksi sebelumnya"
          git push
