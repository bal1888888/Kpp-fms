name: Daily stock hero autopatch

on:
  push:
    branches:
      - fix/daily-stock-total-hero-v1
    paths:
      - scripts/apply-daily-stock-hero.py
      - .github/workflows/daily-stock-hero-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/daily-stock-total-hero-v1
          fetch-depth: 0
      - name: Apply Daily stock hero
        run: python scripts/apply-daily-stock-hero.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary autopatch files
        run: |
          rm -f scripts/apply-daily-stock-hero.py
          rm -f .github/workflows/daily-stock-hero-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ui: padatkan hero total stock Daily Report"
          git push origin HEAD:fix/daily-stock-total-hero-v1
