name: Temp Daily Stock Reconciliation

on:
  push:
    branches:
      - fix/daily-stock-transfer-reconciliation-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: reconcile Daily Report transfer quantities') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/daily-stock-transfer-reconciliation-v2
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/tmp-daily-stock-reconcile.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Remove temporary patch files
        run: rm -f scripts/tmp-daily-stock-reconcile.mjs .github/workflows/tmp-daily-stock-reconcile.yml
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile Daily Report transfer quantities"
          git push origin HEAD:fix/daily-stock-transfer-reconciliation-v2
