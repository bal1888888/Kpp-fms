name: Bulk unit capacity patch

on:
  push:
    branches:
      - feat/bulk-unit-capacity-v1

permissions:
  contents: write

concurrency:
  group: bulk-unit-capacity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/bulk-unit-capacity-v1
          fetch-depth: 0
      - name: Apply bulk capacity helper
        run: python scripts/apply-bulk-unit-capacity.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Commit helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add guarded bulk unit tank capacity helper"
          git push origin HEAD:feat/bulk-unit-capacity-v1
