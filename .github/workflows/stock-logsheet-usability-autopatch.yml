name: Stock and logsheet usability patch

on:
  push:
    branches:
      - fix/stock-gauge-logsheet-hm-v1
    paths:
      - scripts/apply-stock-gauge-logsheet-hm.py
      - .github/workflows/stock-logsheet-usability-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/stock-gauge-logsheet-hm-v1
          fetch-depth: 0

      - name: Apply usability fixes
        run: python scripts/apply-stock-gauge-logsheet-hm.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run full repository checks
        run: |
          npm run check
          git diff --check

      - name: Remove temporary autopatch files
        run: |
          rm scripts/apply-stock-gauge-logsheet-hm.py
          rm .github/workflows/stock-logsheet-usability-autopatch.yml

      - name: Commit patch
        run: |
          git config user.name "kpp-mining"
          git config user.email "iqbalinsani1017@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: rapikan gauge stock dan monitoring HM logsheet"
          git push origin HEAD:fix/stock-gauge-logsheet-hm-v1
