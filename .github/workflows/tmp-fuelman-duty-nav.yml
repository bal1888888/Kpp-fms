name: Temp Fuelman Duty Nav
on:
  push:
    branches:
      - feat/fuelman-duty-pic-transfer-v1
    paths:
      - .github/workflows/tmp-fuelman-duty-nav.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuelman-duty-pic-transfer-v1
      - name: Patch duty navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fuelman.html');s=p.read_text()
          old='''  document.getElementById("fuelingLink").classList.toggle("hidden",duty==="PIC_TRANSFER");'''
          new='''  document.getElementById("fuelingLink").classList.toggle("hidden",duty==="PIC_TRANSFER");
          document.querySelectorAll('a[href="pengisian.html"]').forEach(link=>link.classList.toggle("hidden",duty==="PIC_TRANSFER"));'''
          if old not in s: raise SystemExit('fuelman nav anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Commit and clean
        run: |
          rm -f .github/workflows/tmp-fuelman-duty-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuelman.html .github/workflows/tmp-fuelman-duty-nav.yml
          git commit -m "fix: hide Pengisian navigation for PIC Transfer"
          git push origin HEAD:feat/fuelman-duty-pic-transfer-v1
