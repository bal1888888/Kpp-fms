name: FC click anomaly patch
on:
  push:
    branches: [fix/fc-click-anomaly-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fc-click-anomaly-v2
      - name: Repair patch anchor
        run: python scripts/fix-fc-patch-anchor.py
      - name: Apply patch
        run: python scripts/apply-fc-click-anomaly-v2.py
      - name: Align FC coverage regression
        run: |
          python - <<'PY'
          from pathlib import Path
          fc=Path('fc-chart.js').read_text(encoding='utf-8')
          required=['data-kpi="count"','view.samples','view.transactions','view.coverage']
          missing=[token for token in required if token not in fc]
          if missing:
              raise SystemExit(f'coverage KPI runtime missing: {missing}')
          path=Path('scripts/test-fc-dashboard-informative.mjs')
          text=path.read_text(encoding='utf-8')
          old='ok(fc.includes("view.samples}/${view.transactions}"),"coverage KPI should show valid/total samples");'
          new='ok(fc.includes(\'data-kpi="count"\') && fc.includes("view.samples") && fc.includes("view.transactions") && fc.includes("view.coverage"),"coverage KPI should show valid/total samples");'
          if old not in text:
              raise SystemExit('missing coverage regression anchor')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        if: success()
        run: rm -f scripts/apply-fc-click-anomaly-v2.py scripts/fix-fc-patch-anchor.py .github/workflows/fc-click-anomaly-v2-autopatch.yml
      - name: Commit patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fokus FC interaktif dan tandai anomali HM" || exit 0
          git push
