name: FC click anomaly patch
on:
  push:
    branches: [fix/fc-click-anomaly-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fc-click-anomaly-v2
      - name: Apply patch
        run: python scripts/apply-fc-click-anomaly-v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        if: success()
        run: rm -f scripts/apply-fc-click-anomaly-v2.py .github/workflows/fc-click-anomaly-v2-autopatch.yml
      - name: Commit patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fokus FC interaktif dan tandai anomali HM" || exit 0
          git push
