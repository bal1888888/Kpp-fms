name: Logsheet render window optimization

on:
  push:
    branches:
      - perf/final-heavy-pages-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/final-heavy-pages-v1
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply-logsheet-render-window.py

      - name: Run full repository checks
        run: npm ci --ignore-scripts && npm run check

      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: window large Logsheet rendering"
          git push origin HEAD:perf/final-heavy-pages-v1
