name: Sidebar and FC monitor autopatch

on:
  push:
    branches:
      - ui/sidebar-fc-monitor-v1
    paths:
      - scripts/apply-sidebar-fc-monitor.py
      - .github/workflows/sidebar-fc-monitor-autopatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/sidebar-fc-monitor-v1
          fetch-depth: 0

      - name: Apply sidebar and FC monitor
        run: python scripts/apply-sidebar-fc-monitor.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run full repository checks
        run: npm run check

      - name: Remove temporary autopatch files
        run: |
          rm -f scripts/apply-sidebar-fc-monitor.py
          rm -f .github/workflows/sidebar-fc-monitor-autopatch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ui: sidebar responsif dan grafik FC per unit"
          git push origin HEAD:ui/sidebar-fc-monitor-v1
