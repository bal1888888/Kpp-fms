name: Patch PIC bongkar stock workflow

on:
  push:
    branches:
      - fix/pic-bongkar-stock-workflow-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pic-bongkar-stock-workflow-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/patch-pic-bongkar-stock-workflow.mjs
      - run: npm run check
      - name: Commit hasil patch
        run: |
          git config user.name "kpp-mining"
          git config user.email "iqbalinsani1017@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: buka workflow bongkar dan transfer untuk PIC"
          git push
