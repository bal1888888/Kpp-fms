name: Final cleanup V1

on:
  push:
    branches:
      - chore/final-cleanup-v1

permissions:
  contents: write

concurrency:
  group: final-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/final-cleanup-v1
          fetch-depth: 0

      - name: Apply cleanup
        run: python scripts/apply-final-cleanup.py

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run full repository checks
        run: npm run check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: final cleanup before V1 UAT"
          git push origin HEAD:chore/final-cleanup-v1
