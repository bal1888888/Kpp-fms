name: FC data contract patch
on:
  push:
    branches: [fix/fc-data-contract-v2]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fc-data-contract-v2
      - name: Apply FC data contract repair
        run: python scripts/apply-fc-data-contract-fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        run: rm -f scripts/apply-fc-data-contract-fix.py .github/workflows/fc-data-contract-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sambungkan grafik FC ke schema unit yang benar"
          git push
