name: FC anomaly autopatch

on:
  push:
    branches:
      - fix/fc-anomaly-visibility-v1

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize temporary patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-fc-anomaly-v1.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"      .kpp-fc-summary-head{','".kpp-fc-summary-head{')
          s=s.replace('"      .kpp-fc-detail-table tbody tr:nth-child','".kpp-fc-detail-table tbody tr:nth-child')
          old="replace_once('<th>FC</th><th>OPERATOR</th>', '<th>FC</th><th>STATUS FC</th><th>OPERATOR</th>', 'detail status header')"
          new="src=src.replace('<th>FC</th>', '<th>FC</th><th>STATUS FC</th>', 1)"
          if old not in s:
              raise SystemExit('detail header patch anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply focused patch
        run: python3 scripts/patch-fc-anomaly-v1.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Full regression with diagnostics
        id: regression
        shell: bash
        run: |
          set +e
          npm run check > FC_ANOMALY_DIAGNOSTICS.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat FC_ANOMALY_DIAGNOSTICS.txt
          exit 0
      - name: Persist diagnostics on failure
        if: steps.regression.outputs.exit_code != '0'
        run: |
          git restore fc-chart.js dashboard.html logsheet.html scripts/test-fc-focus-table.mjs || true
          rm -f scripts/test-fc-anomaly-visibility.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FC_ANOMALY_DIAGNOSTICS.txt
          git commit -m "chore: capture FC regression failure"
          git push origin HEAD:fix/fc-anomaly-visibility-v1
          exit 1
      - name: Verify key FC safety markers
        if: steps.regression.outputs.exit_code == '0'
        run: |
          grep -q 'STATUS FC' fc-chart.js
          grep -q 'TRANSAKSI PENGISIAN PERLU CEK HM' fc-chart.js
          grep -q 'rawDelta>maxDelta' fc-chart.js
      - name: Remove temporary patch machinery
        if: steps.regression.outputs.exit_code == '0'
        run: |
          rm scripts/patch-fc-anomaly-v1.py
          rm .github/workflows/autopatch-fc-anomaly-v1.yml
          rm -f FC_ANOMALY_DIAGNOSTICS.txt
      - name: Commit result
        if: steps.regression.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: surface invalid FC transactions and break chart gaps"
          git push origin HEAD:fix/fc-anomaly-visibility-v1
