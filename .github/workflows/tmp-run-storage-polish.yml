name: Temp run storage polish
on:
  push:
    branches:
      - feat/dynamic-storage-master-v1
    paths:
      - .github/workflows/tmp-run-storage-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-storage-master-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch files
        run: python3 scripts/tmp_polish_storage.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit result
        run: |
          git config user.name "kpp-storage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: clarify shared MT FT sounding profiles"
          git push origin HEAD:feat/dynamic-storage-master-v1
