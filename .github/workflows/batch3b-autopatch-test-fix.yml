name: Batch 3B autopatch test fix

on:
  push:
    branches:
      - "hardening/batch3b-wib-web-v1"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/batch3b-wib-web-v1
      - name: Fix WIB test harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/batch3b-autopatch.yml')
          s=p.read_text(encoding='utf-8')
          start_marker='import vm from'
          end_marker='const T=context.window.KPPTime;'
          replacement='''          globalThis.window={};
          await import(\\"../wib-time.js\\");
          const T=globalThis.window.KPPTime;'''
          if start_marker in s and end_marker in s:
              i=s.rfind('\n',0,s.index(start_marker))+1
              j=s.index(end_marker,s.index(start_marker))+len(end_marker)
              s=s[:i]+replacement+s[j:]
              p.write_text(s,encoding='utf-8')
          elif 'globalThis.window={};' not in s:
              raise SystemExit('WIB test harness markers not found')
          Path('.github/workflows/batch3b-autopatch-test-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: use native Node globals for WIB runtime" || exit 0
          git push origin HEAD:hardening/batch3b-wib-web-v1
