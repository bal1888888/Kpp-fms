name: Temp final hardening
on:
  push:
    branches: [final-hardening-20260910]
    paths:
      - '.github/workflows/tmp-final-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-hardening-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening patch
        run: python3 scripts/tmp_final_hardening.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: |
          npm run check
          git diff --check
          grep -q 'save_stock_opening_safe' stock.html
          ! grep -q 'from("stock_opening").upsert' stock.html
          ! grep -q 'foreach_dummy' supabase/migrations/20260910221000_dynamic_storage_backend_v1.sql
      - name: Remove temporary patch files
        run: |
          rm -f scripts/tmp_final_hardening.py .github/workflows/tmp-final-hardening.yml
      - name: Commit result
        run: |
          git config user.name 'kpp-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden dynamic storage backend and safe opening'
          git push origin HEAD:final-hardening-20260910
