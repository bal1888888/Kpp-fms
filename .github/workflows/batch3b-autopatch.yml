name: Batch 3B autopatch

on:
  push:
    branches:
      - "hardening/batch3b-wib-web-v1"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/batch3b-wib-web-v1
          fetch-depth: 0

      - name: Apply WIB runtime, asset versioning, UI polish and query indexes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION="20260911b3"
          ROOT=Path('.')

          wib_js=r'''(function(root){
            "use strict";
            const TZ="Asia/Jakarta";
            const DATE_FMT=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
            const PARTS_FMT=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
            const DISPLAY_FMT=new Intl.DateTimeFormat("id-ID",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});

            function parts(date=new Date()){
              return Object.fromEntries(PARTS_FMT.formatToParts(date).filter(p=>p.type!=="literal").map(p=>[p.type,p.value]));
            }
            function localDate(date=new Date()){
              const p=parts(date);
              return `${p.year}-${p.month}-${p.day}`;
            }
            function localTime(date=new Date()){
              const p=parts(date);
              return `${p.hour}:${p.minute}:${p.second}`;
            }
            function addDays(value,days){
              const [y,m,d]=String(value||"").split("-").map(Number);
              if(!y||!m||!d)throw new Error("Tanggal ISO tidak valid: "+value);
              const x=new Date(Date.UTC(y,m-1,d+Number(days||0)));
              return x.toISOString().slice(0,10);
            }
            function daysInMonth(year,month){
              return new Date(Date.UTC(Number(year),Number(month),0)).getUTCDate();
            }
            function operationalShift(date=new Date()){
              const p=parts(date);
              const mins=Number(p.hour)*60+Number(p.minute);
              let tanggal=`${p.year}-${p.month}-${p.day}`;
              let shift=1;
              if(mins>=18*60+30){
                shift=2;
              }else if(mins<6*60+30){
                shift=2;
                tanggal=addDays(tanggal,-1);
              }
              return {tanggal,shift};
            }
            function operationalPeriod(referenceDate){
              const [y,m,d]=String(referenceDate||"").split("-").map(Number);
              if(!y||!m||!d)throw new Error("Tanggal ISO tidak valid: "+referenceDate);
              if(d>=26){
                const start=`${y}-${String(m).padStart(2,"0")}-26`;
                const next=new Date(Date.UTC(y,m,1));
                const end=`${next.getUTCFullYear()}-${String(next.getUTCMonth()+1).padStart(2,"0")}-25`;
                return {start,end};
              }
              const prev=new Date(Date.UTC(y,m-2,1));
              const start=`${prev.getUTCFullYear()}-${String(prev.getUTCMonth()+1).padStart(2,"0")}-26`;
              const end=`${y}-${String(m).padStart(2,"0")}-25`;
              return {start,end};
            }
            function operationalMtdBounds(date=new Date()){
              const end=localDate(date);
              return {start:operationalPeriod(end).start,end};
            }
            function formatDateTime(date=new Date()){
              return DISPLAY_FMT.format(date);
            }
            root.KPPTime=Object.freeze({TZ,parts,localDate,localTime,addDays,daysInMonth,operationalShift,operationalPeriod,operationalMtdBounds,formatDateTime});
          })(typeof window!=="undefined"?window:globalThis);
          '''
          Path('wib-time.js').write_text(wib_js,encoding='utf-8')

          polish_css=r'''/* KPP-FMS global interaction polish. Business colors/layout remain page-owned. */
          html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
          button,a,input,select,textarea{touch-action:manipulation}
          button,.btn,.app-nav a{transition:transform .14s ease,filter .14s ease,box-shadow .14s ease,border-color .14s ease}
          button:not(:disabled):active,.btn:not(.disabled):active{transform:translateY(1px)}
          button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(37,99,235,.25);outline-offset:2px}
          input:focus,select:focus,textarea:focus{border-color:#60a5fa!important;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
          .panel,.section,.sheet,.form-box,.overview-card,.daily-card,.metric,.card{background-clip:padding-box}
          .table-wrap,.table-wrapper,.table-container,.fc-table-wrap{scrollbar-gutter:stable;overscroll-behavior:contain}
          .status,.note,.sub,.overview-sub,.daily-sub,.metric-note{overflow-wrap:anywhere}
          @media(max-width:700px){button,.btn,input,select{min-height:44px}.container{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}}
          @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
          '''
          Path('kpp-ui-polish.css').write_text(polish_css,encoding='utf-8')

          def replace_function(text,name,replacement):
              marker=f"function {name}("
              start=text.find(marker)
              if start<0:
                  return text,False
              brace=text.find('{',start)
              if brace<0:
                  raise RuntimeError(f"Opening brace missing for {name}")
              depth=0
              i=brace
              quote=None
              escape=False
              while i<len(text):
                  ch=text[i]
                  if quote:
                      if escape:
                          escape=False
                      elif ch=='\\':
                          escape=True
                      elif ch==quote:
                          quote=None
                  else:
                      if ch in ('\"',"'"):
                          quote=ch
                      elif ch=='{':
                          depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0:
                              return text[:start]+replacement+text[i+1:],True
                  i+=1
              raise RuntimeError(f"Closing brace missing for {name}")

          protected=[]
          for path in sorted(ROOT.glob('*.html')):
              text=path.read_text(encoding='utf-8')
              if not re.search(r'<script\s+src="auth\.js(?:\?v=[^"]*)?"></script>',text):
                  continue
              protected.append(path.name)
              text=re.sub(
                  r'<script\s+src="(?:wib-time\.js(?:\?v=[^"]*)?)"></script>\s*',
                  '',text,count=1
              )
              text=re.sub(
                  r'<script\s+src="auth\.js(?:\?v=[^"]*)?"></script>',
                  f'<script src="wib-time.js?v={VERSION}"></script>\n<script src="auth.js?v={VERSION}"></script>',
                  text,count=1
              )
              text=re.sub(
                  r'<script\s+src="storage-master\.js(?:\?v=[^"]*)?"></script>',
                  f'<script src="storage-master.js?v={VERSION}"></script>',
                  text
              )
              if 'kpp-ui-polish.css' not in text:
                  text=text.replace('</head>',f'<link rel="stylesheet" href="kpp-ui-polish.css?v={VERSION}">\n</head>',1)

              # Centralize all current-date/current-time helpers on explicit Asia/Jakarta time.
              text,changed=replace_function(text,'localDate','function localDate(){return window.KPPTime.localDate();}')
              text,changed_time=replace_function(text,'localTime','function localTime(){return window.KPPTime.localTime();}')
              text,changed_shift=replace_function(text,'currentOperationalShift','function currentOperationalShift(){return window.KPPTime.operationalShift();}')
              if path.name=='logsheet.html':
                  text,ok=replace_function(text,'getOperationalMtdBounds','function getOperationalMtdBounds(){return window.KPPTime.operationalMtdBounds();}')
                  if not ok: raise RuntimeError('logsheet getOperationalMtdBounds not found')
              if path.name=='pengisian.html':
                  text,ok=replace_function(text,'getLocalDateTime','function getLocalDateTime(){return {tanggal:window.KPPTime.localDate(),jam:window.KPPTime.localTime()};}')
                  if not ok: raise RuntimeError('pengisian getLocalDateTime not found')
                  text,ok=replace_function(text,'getOperationalDateForFueling','function getOperationalDateForFueling(){\n    if(activeFuelmanSession?.tanggal)return activeFuelmanSession.tanggal;\n    return window.KPPTime.operationalShift().tanggal;\n}')
                  if not ok: raise RuntimeError('pengisian getOperationalDateForFueling not found')

              text=text.replace('new Date().toLocaleString("id-ID")','window.KPPTime.formatDateTime(new Date())')
              text=text.replace("new Date().toLocaleString('id-ID')","window.KPPTime.formatDateTime(new Date())")
              text=re.sub(r'new Date\((year|y),(month|m),0\)\.getDate\(\)',r'window.KPPTime.daysInMonth(\1,\2)',text)
              path.write_text(text,encoding='utf-8')

          required={'dashboard.html','stock.html','daily-report.html','stock-history.html','logsheet.html','pengisian.html','system-health.html'}
          missing=required-set(protected)
          if missing:
              raise RuntimeError('Protected target pages missing auth.js: '+', '.join(sorted(missing)))

          migration=r'''-- KPP-FMS operational query indexes v1.
          -- Read-performance only. No row/value/policy/business-flow change.

          create index if not exists fuel_history_date_shift_truck_idx
            on public.fuel_history (tanggal desc, shift, fuel_truck, jam desc, id desc);

          create index if not exists fuel_history_unit_date_idx
            on public.fuel_history (unit, tanggal desc, jam desc, id desc);

          create index if not exists stock_movements_kind_date_idx
            on public.stock_movements (jenis, tanggal desc, jam desc, id desc);

          create index if not exists fuelman_sessions_period_status_idx
            on public.fuelman_sessions (tanggal desc, shift, status, duty_type, fuel_truck);
          '''
          Path('supabase/migrations/20260911183000_operational_query_indexes_v1.sql').write_text(migration,encoding='utf-8')

          test_js=r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import vm from "node:vm";

          const root=new URL("../",import.meta.url);
          const source=fs.readFileSync(new URL("../wib-time.js",import.meta.url),"utf8");
          const context={window:{},globalThis:{},Intl,Date,Object,Number,String,Error};
          vm.createContext(context);
          vm.runInContext(source,context,{filename:"wib-time.js"});
          const T=context.window.KPPTime;

          test("WIB helper stays correct around UTC date boundary",()=>{
            const early=new Date("2026-09-10T18:00:00Z"); // 11 Sep 01:00 WIB
            assert.equal(T.localDate(early),"2026-09-11");
            assert.equal(T.localTime(early),"01:00:00");
            assert.deepEqual({...T.operationalShift(early)},{tanggal:"2026-09-10",shift:2});
          });

          test("WIB helper resolves shift 1 and shift 2 explicitly",()=>{
            assert.deepEqual({...T.operationalShift(new Date("2026-09-11T02:00:00Z"))},{tanggal:"2026-09-11",shift:1});
            assert.deepEqual({...T.operationalShift(new Date("2026-09-11T12:00:00Z"))},{tanggal:"2026-09-11",shift:2});
          });

          test("operational month remains 26 through 25 without browser timezone",()=>{
            assert.deepEqual({...T.operationalPeriod("2026-09-11")},{start:"2026-08-26",end:"2026-09-25"});
            assert.deepEqual({...T.operationalPeriod("2026-09-28")},{start:"2026-09-26",end:"2026-10-25"});
            assert.equal(T.daysInMonth(2028,2),29);
          });

          test("critical protected pages load versioned runtime and polish",()=>{
            for(const file of ["dashboard.html","stock.html","daily-report.html","stock-history.html","logsheet.html","pengisian.html","system-health.html"]){
              const html=fs.readFileSync(new URL("../"+file,import.meta.url),"utf8");
              assert.match(html,/wib-time\.js\?v=20260911b3/);
              assert.match(html,/auth\.js\?v=20260911b3/);
              assert.match(html,/kpp-ui-polish\.css\?v=20260911b3/);
            }
          });

          test("legacy current-date helpers no longer depend on browser timezone",()=>{
            for(const file of ["dashboard.html","stock.html","daily-report.html","stock-history.html","logsheet.html"]){
              const html=fs.readFileSync(new URL("../"+file,import.meta.url),"utf8");
              if(/function localDate\(/.test(html)){
                assert.doesNotMatch(html,/function localDate\([^)]*\)\s*\{\s*const\s+d\s*=\s*new Date\(\)/s);
              }
            }
            const log=fs.readFileSync(new URL("../logsheet.html",import.meta.url),"utf8");
            assert.match(log,/getOperationalMtdBounds\(\)\{return window\.KPPTime\.operationalMtdBounds\(\);\}/);
          });

          test("query performance migration covers high-volume history paths",()=>{
            const sql=fs.readFileSync(new URL("../supabase/migrations/20260911183000_operational_query_indexes_v1.sql",import.meta.url),"utf8");
            assert.match(sql,/fuel_history_date_shift_truck_idx/i);
            assert.match(sql,/fuel_history_unit_date_idx/i);
            assert.match(sql,/stock_movements_kind_date_idx/i);
            assert.match(sql,/fuelman_sessions_period_status_idx/i);
            assert.doesNotMatch(sql,/\b(insert|update|delete)\b/i);
          });
          '''
          Path('scripts/test-wib-runtime.mjs').write_text(test_js,encoding='utf-8')

          package=Path('package.json')
          pkg=package.read_text(encoding='utf-8')
          needle='scripts/test-global-web-hardening.mjs scripts/test-riwayat-pagination.mjs'
          replacement='scripts/test-global-web-hardening.mjs scripts/test-wib-runtime.mjs scripts/test-riwayat-pagination.mjs'
          if replacement not in pkg:
              if needle not in pkg: raise RuntimeError('package.json check script anchor missing')
              pkg=pkg.replace(needle,replacement,1)
              package.write_text(pkg,encoding='utf-8')

          Path('.github/workflows/batch3b-autopatch.yml').unlink()
          print('Patched protected pages:',len(protected))
          PY

      - name: Run repository checks
        run: npm ci --ignore-scripts && npm run check

      - name: Commit Batch 3B result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: standardize WIB runtime and web asset delivery"
          git push origin HEAD:hardening/batch3b-wib-web-v1
