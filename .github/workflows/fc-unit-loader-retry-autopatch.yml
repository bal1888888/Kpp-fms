name: FC unit loader retry patch
on:
  push:
    branches:
      - fix/fc-unit-loader-retry-v1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fc-unit-loader-retry-v1
          fetch-depth: 0
      - name: Apply FC loader repair
        run: python scripts/apply-fc-unit-loader-retry.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-fc-unit-loader-retry.py
          rm -f .github/workflows/fc-unit-loader-retry-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pulihkan retry loader unit grafik FC"
          git push origin HEAD:fix/fc-unit-loader-retry-v1
