name: Finalize sidebar FC monitor patch

on:
  push:
    branches:
      - ui/sidebar-fc-monitor-v1
    paths:
      - .github/workflows/sidebar-fc-monitor-finalize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/sidebar-fc-monitor-v1
          fetch-depth: 0

      - name: Fix patch boundary and runtime test
        run: |
          python - <<'PY'
          from pathlib import Path

          patch=Path('scripts/apply-sidebar-fc-monitor.py')
          s=patch.read_text(encoding='utf-8')
          old="end = auth.index(end_marker, start)\n"
          new="end = auth.index(end_marker, start) + len('\\n  }')\n"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('patch boundary anchor missing')
          patch.write_text(s,encoding='utf-8')

          test=Path('scripts/test-wib-runtime.mjs')
          t=test.read_text(encoding='utf-8')
          old_test='assert.match(html,/auth\\.js\\?v=20260911b3/);'
          new_test='assert.match(html,/auth\\.js\\?v=[A-Za-z0-9._-]+/);'
          if old_test not in t and new_test not in t:
              raise SystemExit('auth runtime test anchor missing')
          t=t.replace(old_test,new_test,1)
          test.write_text(t,encoding='utf-8')
          PY

      - name: Apply sidebar and FC monitor
        run: python scripts/apply-sidebar-fc-monitor.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run full repository checks
        run: npm run check

      - name: Remove temporary patch files
        run: |
          rm -f scripts/apply-sidebar-fc-monitor.py
          rm -f .github/workflows/sidebar-fc-monitor-autopatch.yml
          rm -f .github/workflows/sidebar-fc-monitor-fix.yml
          rm -f .github/workflows/sidebar-fc-monitor-finalize.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "ui: sidebar responsif dan grafik FC per unit"
          git push origin HEAD:ui/sidebar-fc-monitor-v1
