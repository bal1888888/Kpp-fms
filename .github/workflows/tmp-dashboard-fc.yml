name: Temp Dashboard FC

on:
  push:
    branches:
      - feat/dashboard-fc-unit-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/dashboard-fc-unit-v1
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply FC patch
        run: node scripts/tmp-dashboard-fc-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Remove temporary patch files
        run: |
          rm -f scripts/tmp-dashboard-fc-patch.mjs
          rm -f .github/workflows/tmp-dashboard-fc.yml
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: tampilkan FC per unit di Dashboard"
          git push origin HEAD:feat/dashboard-fc-unit-v1
