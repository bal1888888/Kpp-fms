name: Temp stock movement idempotency patch

on:
  push:
    branches:
      - hardening/stock-movement-idempotency-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/stock-movement-idempotency-v1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Patch Stock RECEIPT and TRANSFER safe delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('stock.html')
          s=p.read_text()

          anchor='const LAST_COPY_REPORTS={opening:"",receipt:"",transfer:"",closing:""};\n'
          helper=r'''const LAST_COPY_REPORTS={opening:"",receipt:"",transfer:"",closing:""};

function stockMovementRequestKey(){
    const uid=window.KPP_SESSION?.user?.id||"unknown";
    return "kpp-stock-movement-safe-v1:"+uid;
}

function stockMovementRequestId(){
    if(window.crypto?.randomUUID)return window.crypto.randomUUID();
    const bytes=new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    bytes[6]=(bytes[6]&15)|64;
    bytes[8]=(bytes[8]&63)|128;
    return [...bytes].map((value,index)=>{
        const hex=value.toString(16).padStart(2,"0");
        return [4,6,8,10].includes(index)?"-"+hex:hex;
    }).join("");
}

function readPendingStockMovement(){
    const raw=localStorage.getItem(stockMovementRequestKey());
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    if(!parsed || parsed.version!==1 || !parsed.id || !parsed.payload || !parsed.recordedAt){
        throw new Error("Status transaksi lokal tidak dikenali. Jangan input ulang sebelum diperiksa Admin/GL.");
    }
    return parsed;
}

function writePendingStockMovement(request){
    localStorage.setItem(stockMovementRequestKey(),JSON.stringify({...request,version:1}));
}

function clearPendingStockMovement(requestId){
    const current=readPendingStockMovement();
    if(current?.id===requestId)localStorage.removeItem(stockMovementRequestKey());
}

function sameStockMovementPayload(left,right){
    return JSON.stringify(left)===JSON.stringify(right);
}

async function dispatchStockMovementRequest(request){
    const {data,error}=await db.rpc("save_stock_movement_safe",{
        p_request_id:request.id,
        p_payload:request.payload,
        p_recorded_at:request.recordedAt
    });

    if(error || !data || typeof data.ok!=="boolean"){
        return {
            data:null,
            error:{
                message:"Hasil transaksi belum terkonfirmasi. ID transaksi tetap tersimpan di perangkat. Tekan SIMPAN lagi saat koneksi stabil untuk mengecek/kirim ulang transaksi yang sama. "+(error?.message||"")
            },
            ambiguous:true
        };
    }

    if(!data.ok){
        clearPendingStockMovement(request.id);
        return {
            data:null,
            error:{message:data.message||"Transaksi ditolak server."},
            rejected:true
        };
    }

    clearPendingStockMovement(request.id);
    return {
        data:data.data||{},
        error:null,
        replayed:!!data.replayed
    };
}

async function sendStockMovementSafe(payload){
    const run=async()=>{
        try{
            let pending=readPendingStockMovement();
            if(pending){
                const same=sameStockMovementPayload(pending.payload,payload);
                const previous=await dispatchStockMovementRequest(pending);
                if(previous.error)return previous;
                return same?previous:{...previous,previousOnly:true};
            }

            pending={
                id:stockMovementRequestId(),
                payload:JSON.parse(JSON.stringify(payload)),
                recordedAt:new Date().toISOString()
            };
            writePendingStockMovement(pending);
            return await dispatchStockMovementRequest(pending);
        }catch(error){
            return {
                data:null,
                error:{message:"Pengaman transaksi lokal gagal: "+error.message}
            };
        }
    };

    if(navigator.locks){
        return navigator.locks.request(stockMovementRequestKey()+":lock",run);
    }
    return run();
}
'''
