name: Temp stock movement idempotency patch

on:
  push:
    branches:
      - hardening/stock-movement-idempotency-v1
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: hardening/stock-movement-idempotency-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Apply patch
        run: python scripts/tmp_patch_stock_idempotency.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run checks
        run: npm run check
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/tmp-stock-movement-idempotency.yml
          rm scripts/tmp_patch_stock_idempotency.py
          git config user.name "kpp-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stock.html .github/workflows/tmp-stock-movement-idempotency.yml scripts/tmp_patch_stock_idempotency.py
          git commit -m "fix: make receipt and transfer delivery idempotent"
          git push origin HEAD:hardening/stock-movement-idempotency-v1
