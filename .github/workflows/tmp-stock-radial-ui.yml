name: Temp stock radial UI patch

on:
  push:
    branches: ["ui/stock-radial-gauges"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stock-radial-gauges
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply radial stock patch
        run: python scripts/tmp_patch_stock_radial.py
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit result
        shell: bash
        run: |
          rm -f scripts/tmp_patch_stock_radial.py .github/workflows/tmp-stock-radial-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.html package.json scripts/test-stock-radial-ui.mjs scripts/tmp_patch_stock_radial.py .github/workflows/tmp-stock-radial-ui.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ui: ubah indikator stock menjadi radial"
          git push origin HEAD:ui/stock-radial-gauges
