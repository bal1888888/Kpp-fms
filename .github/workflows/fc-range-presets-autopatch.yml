name: FC range presets patch
on:
  push:
    branches: [feat/fc-range-presets-v1]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fc-range-presets-v1
      - name: Apply FC range presets patch
        run: python scripts/apply-fc-range-presets.py
      - name: Refresh FC asset regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              'scripts/test-fc-data-contract.mjs',
              'scripts/test-fc-mtd-context.mjs',
              'scripts/test-fc-dashboard-informative.mjs',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('20260912e', '20260912f')
              path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full repository checks
        run: npm run check
      - name: Remove temporary patch files
        run: rm -f scripts/apply-fc-range-presets.py .github/workflows/fc-range-presets-autopatch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: tambah preset rentang grafik FC" || exit 0
          git push
