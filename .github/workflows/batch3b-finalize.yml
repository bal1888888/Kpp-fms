name: Batch 3B finalize

on:
  push:
    branches:
      - "hardening/batch3b-wib-web-v1"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/batch3b-wib-web-v1
          fetch-depth: 0

      - name: Execute Batch 3B patch and repair test harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/batch3b-autopatch.yml').read_text(encoding='utf-8')
          start=workflow.index("          python - <<'PY'")+len("          python - <<'PY'\n")
          end=workflow.index("\n          PY",start)
          patch_script=textwrap.dedent(workflow[start:end])

          # Keep page-specific operational-shift resolvers intact. Some pages,
          # such as CCR, delegate this rule to their tested domain helper.
          shift_rewrite="text,changed_shift=replace_function(text,'currentOperationalShift','function currentOperationalShift(){return window.KPPTime.operationalShift();}')"
          if shift_rewrite not in patch_script:
            raise RuntimeError('Batch 3B shift rewrite anchor missing')
          patch_script=patch_script.replace(shift_rewrite,"changed_shift=False",1)

          exec(compile(patch_script,'batch3b-embedded.py','exec'),{})

          # Existing storage helper contracts intentionally use the canonical
          # filename. Cache-bust auth/WIB/polish assets without changing it.
          for page in Path('.').glob('*.html'):
            html=page.read_text(encoding='utf-8')
            fixed=html.replace('storage-master.js?v=20260911b3','storage-master.js')
            if fixed!=html:
              page.write_text(fixed,encoding='utf-8')

          test=Path('scripts/test-wib-runtime.mjs')
          s=test.read_text(encoding='utf-8')
          i=s.index('import vm from')
          line_start=s.rfind('\n',0,i)+1
          marker='const T=context.window.KPPTime;'
          j=s.index(marker,i)+len(marker)
          replacement='globalThis.window={};\nawait import("../wib-time.js");\nconst T=globalThis.window.KPPTime;'
          s=s[:line_start]+replacement+s[j:]
          test.write_text(s,encoding='utf-8')

          for temp in [
            '.github/workflows/batch3b-autopatch-test-fix.yml',
            '.github/workflows/batch3b-finalize.yml'
          ]:
            p=Path(temp)
            if p.exists(): p.unlink()
          PY

      - name: Run full repository checks
        run: npm ci --ignore-scripts && npm run check

      - name: Commit final Batch 3B
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: standardize WIB runtime and web asset delivery"
          git push origin HEAD:hardening/batch3b-wib-web-v1
