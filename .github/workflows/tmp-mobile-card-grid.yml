name: Temp mobile stock grid fix

on:
  push:
    branches:
      - ui/stock-radial-mobile-all

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/stock-radial-mobile-all
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Keep stock cards side by side on phones
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('stock-daily-ui.css')
          s=p.read_text(encoding='utf-8')
          old='@media(max-width:420px){.stock-workspace .cards,.daily-workspace .cards{grid-template-columns:1fr}}'
          new='@media(max-width:420px){.stock-workspace .cards,.daily-workspace .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}'
          if old not in s:
              raise SystemExit('shared mobile 1-column rule not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/tmp-mobile-card-grid.yml').unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: pertahankan dua kartu stock per baris di HP"
          git push origin HEAD:ui/stock-radial-mobile-all
