<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Approval CCR - KPP FMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.KPP_ALLOWED_ROLES=["gl","admin","atasan"];
window.KPP_ACTIVE_PAGE="ccr-approval";
</script>
<script src="wib-time.js?v=20260911b3"></script>
<script src="auth.js?v=20260912-sidebar1"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f4f6;color:#111827}
.header{background:#1f2937;color:white;text-align:center;padding:21px}
.header h1{margin:0 0 5px;font-size:23px}
.container{max-width:1180px;margin:24px auto;padding:14px}
.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.07)}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{padding:10px 9px;border-bottom:1px solid #e5e7eb;border-right:1px solid #eef2f7;font-size:12px;text-align:center}
th{background:#1f2937;color:white}
td.left{text-align:left}
button{border:0;border-radius:8px;padding:8px 11px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.approve{background:#16a34a;color:white}
.reject{background:#dc2626;color:white}
.refresh{background:white;color:#334155;border:1px solid #cbd5e1}
.status{margin-top:12px;font-weight:bold;font-size:13px}
.app-nav{background:#111827;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid #374151;padding:9px 12px;position:sticky;top:0;z-index:999}
.app-nav-inner{max-width:1250px;margin:0 auto;display:flex;justify-content:center;gap:12px;align-items:center;overflow-x:auto}
.app-nav a{color:#e5e7eb;text-decoration:none;padding:10px 16px;border-radius:7px;white-space:nowrap;font-size:13px;font-weight:bold}
.app-nav a.active{background:#2563eb;color:#fff}
.kpp-userbar{background:#fff;border-bottom:1px solid #e5e7eb}
.kpp-userbar-inner{max-width:1250px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.kpp-userbar button{border:0;border-radius:7px;padding:8px 11px;background:#dc2626;color:#fff;font-weight:bold}
@media(max-width:560px){.container{margin:10px auto;padding:9px}.panel{padding:13px}.header h1{font-size:18px}.app-nav-inner{justify-content:flex-start}}
</style>
<link rel="stylesheet" href="kpp-ui-polish.css?v=20260911b3">
</head>
<body>
<div class="header">
  <h1>KPP FUEL MANAGEMENT SYSTEM</h1>
  <div>Persetujuan Jatah CCR</div>
</div>
<div id="kppUserBar" class="kpp-userbar"></div>
<div id="kppRoleNav"></div>

<div class="container">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <h2 style="margin:0">Pending Approval</h2>
      <button id="refreshBtn" class="refresh">↻ REFRESH</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th><th>Shift</th><th>Ke-</th><th>Unit</th><th>Nama</th><th>HM Sebelum</th><th>HM Aktual</th><th>Jam Ambil</th><th>Jam Kerja</th><th>Jatah</th><th>Tol.</th><th>Batas</th><th>Alasan</th><th>Diajukan Oleh</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="status" class="status"></div>
  </div>
</div>

<script>
const db=window.KPP.db;
let PROFILE=null;
let ROWS=[];
let BUSY=false;

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function fmt(v){const x=Number(v);return Number.isFinite(x)?new Intl.NumberFormat("id-ID",{maximumFractionDigits:1}).format(x):"-"}
function dateID(v){if(!v)return "-";const [y,m,d]=String(v).split("-");return `${d}/${m}/${y}`}

async function expireStale(){
  const {error}=await db.rpc("expire_ccr_allocations");
  if(error)console.warn("Expire CCR:",error.message);
}

function setBusy(value){
  BUSY=value;
  document.querySelectorAll("button").forEach(button=>button.disabled=value);
}

async function load(){
  const status=document.getElementById("status");
  status.textContent="Memuat...";
  await expireStale();

  const {data,error}=await db.from("ccr_allocations").select("*")
    .eq("status","PENDING_GL")
    .order("tanggal",{ascending:true})
    .order("id",{ascending:true});

  if(error){
    status.textContent="❌ "+error.message;
    return;
  }

  ROWS=data||[];
  const body=document.getElementById("body");

  body.innerHTML=ROWS.length?ROWS.map(r=>{
    const max=Number(r.max_qty||0)+Number(r.tolerance_qty||0);
    return `<tr>
      <td>${dateID(r.tanggal)}</td>
      <td>${esc(r.shift)}</td>
      <td><b>${r.filling_no}</b></td>
      <td><b>${esc(r.unit)}</b></td>
      <td class="left">${esc(r.operator_unit)}</td>
      <td>${fmt(r.hm_previous_ref)}</td>
      <td><b>${fmt(r.hm_ccr)}</b></td>
      <td>${String(r.hm_taken_time||"-").slice(0,5)}</td>
      <td>${r.hm_work_since_previous===null||r.hm_work_since_previous===undefined?"-":fmt(r.hm_work_since_previous)+" jam"}</td>
      <td>${fmt(r.max_qty)} L</td>
      <td>${fmt(r.tolerance_qty)} L</td>
      <td><b>${fmt(max)} L</b></td>
      <td class="left">${esc(r.request_reason||"-")}</td>
      <td>${esc(r.created_by_name||"-")}</td>
      <td>
        <button class="approve" data-id="${r.id}">SETUJUI</button>
        <button class="reject" data-id="${r.id}">TOLAK</button>
      </td>
    </tr>`;
  }).join(""):'<tr><td colspan="15">Tidak ada pengajuan pending.</td></tr>';

  body.querySelectorAll(".approve").forEach(b=>b.addEventListener("click",()=>approve(b.dataset.id)));
  body.querySelectorAll(".reject").forEach(b=>b.addEventListener("click",()=>rejectRow(b.dataset.id)));
  status.textContent=`${ROWS.length} pengajuan menunggu persetujuan.`;
}

async function approve(id){
  if(BUSY)return;
  const r=ROWS.find(x=>String(x.id)===String(id));
  if(!r)return;
  if(!confirm(`Setujui ${r.unit} pengisian ke-${r.filling_no}?`))return;

  const status=document.getElementById("status");
  setBusy(true);
  try{
    const {data:active,error:activeErr}=await db.from("ccr_allocations")
      .select("id,filling_no,unit")
      .eq("unit",r.unit)
      .eq("status","ACTIVE")
      .neq("id",r.id)
      .limit(1);

    if(activeErr)throw activeErr;
    if(active?.length){
      status.textContent=`❌ ${r.unit} masih punya pengisian ke-${active[0].filling_no} ACTIVE.`;
      return;
    }

    const {data,error}=await db.from("ccr_allocations")
      .update({status:"ACTIVE"})
      .eq("id",id)
      .eq("status","PENDING_GL")
      .select("id,status")
      .maybeSingle();

    if(error)throw error;
    if(!data){
      status.textContent="Pengajuan sudah berubah. Data dimuat ulang.";
      return;
    }
    status.textContent=`✅ Pengisian ke-${r.filling_no} disetujui.`;
  }catch(error){
    status.textContent="❌ Gagal approve: "+error.message;
  }finally{
    setBusy(false);
    await load();
  }
}

async function rejectRow(id){
  if(BUSY)return;
  const r=ROWS.find(x=>String(x.id)===String(id));
  if(!r)return;

  const reason=prompt(`Alasan menolak pengisian ke-${r.filling_no} ${r.unit}:`);
  if(reason===null)return;
  if(!String(reason).trim()){
    alert("Alasan penolakan wajib diisi.");
    return;
  }

  const status=document.getElementById("status");
  setBusy(true);
  try{
    const {data,error}=await db.from("ccr_allocations")
      .update({status:"REJECTED",rejected_reason:String(reason).trim()})
      .eq("id",id)
      .eq("status","PENDING_GL")
      .select("id,status")
      .maybeSingle();

    if(error)throw error;
    if(!data){
      status.textContent="Pengajuan sudah berubah. Data dimuat ulang.";
      return;
    }
    status.textContent=`✅ Pengisian ke-${r.filling_no} ditolak.`;
  }catch(error){
    status.textContent="❌ Gagal menolak: "+error.message;
  }finally{
    setBusy(false);
    await load();
  }
}

document.getElementById("refreshBtn").addEventListener("click",load);
document.addEventListener("kpp-auth-ready",async e=>{
  PROFILE=e.detail.profile;
  await load();
});
</script>
</body>
</html>
