<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Unit DT7441 - KPP FMS</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 10px;
        }

        .unit {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
        }

        #qrcode {
            margin: 25px auto;
            width: 256px;
        }

        p {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>KPP FUEL MANAGEMENT SYSTEM</h2>

        <p>QR UNIT</p>

        <div class="unit">DT7441</div>

        <div id="qrcode"></div>

        <p>Scan QR ini untuk pengisian fuel.</p>

    </div>

    <script>

        new QRCode(
            document.getElementById("qrcode"),
            {
                text: "DT7441",
                width: 256,
                height: 256
            }
        );

    </script>

</body>
</html>
