<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - KPP FMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:#f3f4f6;display:flex;align-items:center;justify-content:center;padding:18px;color:#111827}
.box{width:100%;max-width:470px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.brand{text-align:center;margin-bottom:22px}
.brand h1{margin:0 0 6px;font-size:23px;color:#1f2937}
.brand p{margin:0;color:#64748b;font-size:13px}
label{display:block;font-size:13px;font-weight:bold;margin:15px 0 7px}
select,input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}
.account-preview{margin-top:12px;padding:13px;border-radius:9px;background:#eff6ff;border:1px solid #bfdbfe;display:none}
.account-preview strong{display:block;margin-bottom:5px}
.account-preview span{font-size:12px;color:#475569}
button{width:100%;border:0;border-radius:8px;padding:13px;margin-top:20px;background:#2563eb;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{background:#94a3b8}
.status{min-height:18px;text-align:center;font-size:13px;font-weight:bold;margin-top:13px}
.note{margin-top:18px;padding:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;font-size:12px;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <h1>KPP FUEL MANAGEMENT SYSTEM</h1>
    <p>Pilih akun dan masukkan password</p>
  </div>

  <label>Akun</label>
  <select id="account">
    <option value="">Memuat daftar akun...</option>
  </select>

  <div id="preview" class="account-preview">
    <strong id="previewName">-</strong>
    <span id="previewRole">-</span>
  </div>

  <label>Password</label>
  <input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password">

  <button id="loginBtn">MASUK</button>
  <div id="status" class="status"></div>

  <div class="note">
    GL masuk langsung ke Dashboard dan punya akses penuh termasuk Kelola Akun. Admin masuk langsung ke Dashboard dengan akses operasional/admin. Fuelman masuk ke menu Fuelman, dan CCR masuk ke Display CCR.
  </div>
</div>

<script>
const db=supabase.createClient("https://pwowtyfybfqsveuvqrsb.supabase.co","sb_publishable_XTHqun0VSNRFjYt7Dzqmkg_NTSPnKj0");
let DIRECTORY=[];

function labelRole(r){
  if(r==="gl")return "GL";
  if(r==="admin")return "ADMIN";
  if(r==="ccr")return "CCR";
  return "FUELMAN";
}

async function loadDirectory(){
  const select=document.getElementById("account");
  const status=document.getElementById("status");

  const {data,error}=await db.rpc("login_directory");

  if(error){
    select.innerHTML='<option value="">Gagal memuat akun</option>';
    status.textContent="❌ "+error.message;
    return;
  }

  DIRECTORY=data||[];

  select.innerHTML='<option value="">-- Pilih Akun --</option>'+
    DIRECTORY.map(row=>`
      <option value="${row.username}">
        ${row.display_name} — ${row.jabatan || labelRole(row.role)}
      </option>
    `).join("");
}

function showPreview(){
  const username=document.getElementById("account").value;
  const row=DIRECTORY.find(x=>x.username===username);
  const box=document.getElementById("preview");

  if(!row){
    box.style.display="none";
    return;
  }

  document.getElementById("previewName").textContent=row.display_name;
  document.getElementById("previewRole").textContent=
    "Jabatan: "+(row.jabatan||labelRole(row.role));
  box.style.display="block";
}

async function route(){
  const {data}=await db.auth.getSession();
  if(!data.session)return false;

  const {data:profileData,error}=await db.rpc("current_staff_profile");
  if(error)throw error;

  const p=Array.isArray(profileData)?profileData[0]:profileData;

  if(!p||!p.active){
    await db.auth.signOut();
    throw new Error("Akun tidak aktif.");
  }

  if(p.role==="gl") window.location.replace("dashboard.html");
  else if(p.role==="admin") window.location.replace("dashboard.html");
  else if(p.role==="ccr") window.location.replace("ccr.html");
  else window.location.replace("fuelman.html");

  return true;
}

async function login(){
  const username=document.getElementById("account").value;
  const password=document.getElementById("password").value;
  const status=document.getElementById("status");
  const btn=document.getElementById("loginBtn");

  if(!username){
    status.textContent="❌ Pilih akun.";
    return;
  }

  if(!password){
    status.textContent="❌ Masukkan password.";
    return;
  }

  btn.disabled=true;
  btn.textContent="MEMERIKSA...";
  status.textContent="";

  try{
    const email=username+"@kpp.local";

    const {error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;

    await route();
  }catch(error){
    status.textContent="❌ Password salah atau akun tidak dapat digunakan.";
    btn.disabled=false;
    btn.textContent="MASUK";
  }
}

document.getElementById("account").addEventListener("change",showPreview);
document.getElementById("loginBtn").addEventListener("click",login);
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")login();});

route().catch(()=>{});
loadDirectory();
</script>
</body>
</html>
