<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pengisian Fuel - KPP FMS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .scan-box {
            background: #f3f4f6;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .scan-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .scan-btn {
            display: inline-block;
            background: #16a34a;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .info {
            background: #eff6ff;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>KPP FUEL MANAGEMENT SYSTEM</h1>
        <p>PT KPP - Pengisian Fuel</p>
    </div>

    <div class="container">

        <div class="form-box">

            <h2>⛽ Pengisian Fuel</h2>

            <div class="info">
                Silakan scan QR unit kemudian isi HM dan jumlah fuel.
            </div>

            <div class="scan-box">

                <div class="scan-icon">📷</div>

                <p style="margin-bottom: 12px;">
                    Scan QR Code Unit
                </p>

                <button class="scan-btn">
                    Scan QR
                </button>

            </div>

            <div class="form-group">
                <label>Unit</label>
                <input type="text" placeholder="Contoh: DT7441">
            </div>

            <div class="form-group">
                <label>HM</label>
                <input type="number" placeholder="Masukkan HM">
            </div>

            <div class="form-group">
                <label>Jumlah Fuel (Liter)</label>
                <input type="number" step="0.01" placeholder="Masukkan jumlah liter">
            </div>

            <div class="form-group">
                <label>Shift</label>

                <select>
                    <option value="">-- Pilih Shift --</option>
                    <option value="1">Shift 1</option>
                    <option value="2">Shift 2</option>
                </select>

            </div>

            <button class="save-btn">
                SIMPAN DATA
            </button>

            <a href="index.html" class="back">
                ← Kembali ke Dashboard
            </a>

        </div>

    </div>

</body>
</html>
