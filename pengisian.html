<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pengisian Fuel - KPP FMS</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .info {
            background: #eff6ff;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .unit-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        #unitInput {
            text-transform: uppercase;
        }

        .check-btn {
            width: 100%;
            background: #16a34a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
        }

        .check-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .unit-result {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .unit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-name {
            font-weight: bold;
            font-size: 18px;
        }

        .previous-hm {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .previous-hm small {
            display: block;
            color: #777;
            margin-bottom: 5px;
        }

        .previous-hm strong {
            font-size: 25px;
            color: #ea580c;
        }

        .hm-result {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .hm-result small {
            display: block;
            color: #666;
            margin-bottom: 5px;
        }

        .hm-result strong {
            font-size: 24px;
            color: #16a34a;
        }

        .warning {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .save-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>KPP FUEL MANAGEMENT SYSTEM</h1>
    <p>PT KPP - Pengisian Fuel</p>
</div>

<div class="container">

    <div class="form-box">

        <h2>⛽ Pengisian Fuel</h2>

        <div class="info">
            Masukkan nomor unit lalu tekan <b>CEK UNIT</b>.
            Sistem akan mengambil HM terakhir dari database.
        </div>

        <!-- INPUT UNIT -->
        <div class="unit-box">

            <div class="form-group">

                <label>Unit</label>

                <input
                    type="text"
                    id="unitInput"
                    placeholder="Contoh: DT7441"
                    autocomplete="off"
                >

            </div>

            <button
                class="check-btn"
                id="checkUnitButton">

                CEK UNIT / AMBIL HM

            </button>

        </div>

        <!-- HASIL UNIT -->
        <div
            class="unit-result hidden"
            id="unitResult">

            <div class="unit-row">

                <span>Unit Terpilih</span>

                <span
                    class="unit-name"
                    id="unitDisplay">

                    -

                </span>

            </div>

        </div>

        <!-- HM SEBELUMNYA -->
        <div
            class="previous-hm hidden"
            id="previousHmBox">

            <small>
                HM SEBELUMNYA
            </small>

            <strong id="previousHm">
                -
            </strong>

        </div>

        <!-- FORM PENGISIAN -->
        <div
            id="formArea"
            class="hidden">

            <div class="form-group">

                <label>
                    HM Sekarang
                </label>

                <input
                    type="number"
                    id="currentHm"
                    placeholder="Masukkan HM sekarang"
                    step="0.1"
                >

            </div>

            <div class="hm-result">

                <small>
                    HM JALAN
                </small>

                <strong id="hmDifference">
                    0 HM
                </strong>

            </div>

            <div
                class="warning"
                id="warning">

                ⚠️ HM sekarang tidak boleh lebih kecil dari HM sebelumnya.

            </div>

            <div class="form-group">

                <label>
                    Nama Operator
                </label>

                <input
                    type="text"
                    id="operator"
                    placeholder="Masukkan nama operator"
                >

            </div>

            <div class="form-group">

                <label>
                    Jumlah Fuel (Liter)
                </label>

                <input
                    type="number"
                    id="fuelQty"
                    placeholder="Masukkan jumlah liter"
                    step="0.01"
                    min="0"
                >

            </div>

            <div class="form-group">

                <label>
                    Shift
                </label>

                <select id="shift">

                    <option value="">
                        -- Pilih Shift --
                    </option>

                    <option value="1">
                        Shift 1
                    </option>

                    <option value="2">
                        Shift 2
                    </option>

                </select>

            </div>

            <button
                class="save-btn"
                id="saveButton">

                SIMPAN DATA

            </button>

        </div>

        <a
            href="index.html"
            class="back">

            ← Kembali ke Dashboard

        </a>

    </div>

</div>

<script>

    // =====================================
    // SUPABASE
    // =====================================

    const SUPABASE_URL =
        "https://pwowtyfybfqsveuvqrsb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_XTHqun0VSNRFjYt7Dzqmkg_NTSPnKj0";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =====================================
    // VARIABEL
    // =====================================

    let currentUnit = "";
    let previousHM = 0;
    let checkedUnit = "";


    // =====================================
    // NORMALISASI UNIT
    // =====================================

    function normalisasiUnit(unit) {

        return unit
            .trim()
            .toUpperCase();

    }


    // Otomatis huruf kapital
    document
        .getElementById("unitInput")
        .addEventListener(
            "input",
            function() {

                this.value =
                    this.value.toUpperCase();

            }
        );


    // Tekan Enter = cek unit
    document
        .getElementById("unitInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    document
                        .getElementById(
                            "checkUnitButton"
                        )
                        .click();

                }

            }
        );


    // =====================================
    // AMBIL HM TERAKHIR
    // =====================================

    async function ambilHmTerakhir(unit) {

        const { data, error } =
            await supabaseClient

                .from("fuel_history")

                .select(
                    "hm_akhir,id"
                )

                .eq(
                    "unit",
                    unit
                )

                .order(
                    "id",
                    {
                        ascending: false
                    }
                )

                .limit(1);


        if (error) {

            throw error;

        }


        if (
            data &&
            data.length > 0
        ) {

            return Number(
                data[0].hm_akhir
            ) || 0;

        }


        return 0;

    }


    // =====================================
    // CEK UNIT
    // =====================================

    document
        .getElementById(
            "checkUnitButton"
        )
        .addEventListener(
            "click",
            async function() {


                const button =
                    document.getElementById(
                        "checkUnitButton"
                    );


                const inputUnit =
                    normalisasiUnit(
                        document
                            .getElementById(
                                "unitInput"
                            )
                            .value
                    );


                if (!inputUnit) {

                    alert(
                        "Masukkan nomor unit terlebih dahulu."
                    );

                    return;

                }


                button.disabled =
                    true;


                button.textContent =
                    "MENGAMBIL DATA...";


                try {

                    previousHM =
                        await ambilHmTerakhir(
                            inputUnit
                        );


                    currentUnit =
                        inputUnit;


                    checkedUnit =
                        inputUnit;


                    document
                        .getElementById(
                            "unitInput"
                        )
                        .value =
                        currentUnit;


                    document
                        .getElementById(
                            "unitDisplay"
                        )
                        .textContent =
                        currentUnit;


                    document
                        .getElementById(
                            "unitResult"
                        )
                        .classList
                        .remove(
                            "hidden"
                        );


                    document
                        .getElementById(
                            "previousHmBox"
                        )
                        .classList
                        .remove(
                            "hidden"
                        );


                    document
                        .getElementById(
                            "formArea"
                        )
                        .classList
                        .remove(
                            "hidden"
                        );


                    if (
                        previousHM > 0
                    ) {

                        document
                            .getElementById(
                                "previousHm"
                            )
                            .textContent =
                            previousHM
                                .toLocaleString(
                                    "id-ID"
                                );

                    } else {

                        document
                            .getElementById(
                                "previousHm"
                            )
                            .textContent =
                            "Belum ada data";

                    }


                    document
                        .getElementById(
                            "currentHm"
                        )
                        .value =
                        "";


                    document
                        .getElementById(
                            "hmDifference"
                        )
                        .textContent =
                        "0 HM";


                    document
                        .getElementById(
                            "warning"
                        )
                        .style
                        .display =
                        "none";


                } catch (error) {

                    console.error(
                        error
                    );


                    alert(
                        "❌ Gagal mengambil data unit.\n\n" +
                        error.message
                    );

                }


                button.disabled =
                    false;


                button.textContent =
                    "CEK UNIT / AMBIL HM";

            }
        );


    // =====================================
    // HITUNG HM JALAN
    // =====================================

    document
        .getElementById(
            "currentHm"
        )
        .addEventListener(
            "input",
            function() {


                const currentHM =
                    parseFloat(
                        this.value
                    );


                const warning =
                    document.getElementById(
                        "warning"
                    );


                const result =
                    document.getElementById(
                        "hmDifference"
                    );


                if (
                    isNaN(
                        currentHM
                    )
                ) {

                    result.textContent =
                        "0 HM";


                    warning.style.display =
                        "none";


                    return;

                }


                if (
                    previousHM > 0 &&
                    currentHM < previousHM
                ) {

                    warning.style.display =
                        "block";


                    result.textContent =
                        "HM TIDAK VALID";


                    return;

                }


                warning.style.display =
                    "none";


                if (
                    previousHM > 0
                ) {

                    const difference =
                        currentHM -
                        previousHM;


                    result.textContent =
                        difference
                            .toLocaleString(
                                "id-ID"
                            ) +
                        " HM";

                } else {

                    result.textContent =
                        "Data awal";

                }

            }
        );


    // =====================================
    // TANGGAL & JAM LOKAL
    // =====================================

    function getLocalDateTime() {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        const hour =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minute =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        const second =
            String(
                now.getSeconds()
            ).padStart(
                2,
                "0"
            );


        return {

            tanggal:
                `${year}-${month}-${day}`,

            jam:
                `${hour}:${minute}:${second}`

        };

    }


    // =====================================
    // SIMPAN DATA
    // =====================================

    document
        .getElementById(
            "saveButton"
        )
        .addEventListener(
            "click",
            async function() {


                const saveButton =
                    document.getElementById(
                        "saveButton"
                    );


                const unitSekarang =
                    normalisasiUnit(
                        document
                            .getElementById(
                                "unitInput"
                            )
                            .value
                    );


                if (
                    !checkedUnit ||
                    unitSekarang !== checkedUnit
                ) {

                    alert(
                        "Nomor unit berubah.\nSilakan tekan CEK UNIT lagi sebelum menyimpan."
                    );

                    return;

                }


                const currentHM =
                    parseFloat(
                        document
                            .getElementById(
                                "currentHm"
                            )
                            .value
                    );


                const operator =
                    document
                        .getElementById(
                            "operator"
                        )
                        .value
                        .trim();


                const fuel =
                    parseFloat(
                        document
                            .getElementById(
                                "fuelQty"
                            )
                            .value
                    );


                const shift =
                    document
                        .getElementById(
                            "shift"
                        )
                        .value;


                // VALIDASI

                if (
                    isNaN(
                        currentHM
                    )
                ) {

                    alert(
                        "Masukkan HM sekarang."
                    );

                    return;

                }


                if (
                    previousHM > 0 &&
                    currentHM < previousHM
                ) {

                    alert(
                        "HM sekarang tidak boleh lebih kecil dari HM sebelumnya."
                    );

                    return;

                }


                if (!operator) {

                    alert(
                        "Masukkan nama operator."
                    );

                    return;

                }


                if (
                    isNaN(fuel) ||
                    fuel <= 0
                ) {

                    alert(
                        "Masukkan jumlah fuel."
                    );

                    return;

                }


                if (!shift) {

                    alert(
                        "Silakan pilih shift."
                    );

                    return;

                }


                const waktu =
                    getLocalDateTime();


                const hmJalan =
                    previousHM > 0
                    ? currentHM -
                      previousHM
                    : 0;


                saveButton.disabled =
                    true;


                saveButton.textContent =
                    "MENYIMPAN...";


                // SIMPAN KE SUPABASE

                const { error } =
                    await supabaseClient

                        .from(
                            "fuel_history"
                        )

                        .insert({

                            tanggal:
                                waktu.tanggal,

                            jam:
                                waktu.jam,

                            unit:
                                currentUnit,

                            operator:
                                operator,

                            hm_awal:
                                previousHM,

                            hm_akhir:
                                currentHM,

                            hm_jalan:
                                hmJalan,

                            fuel:
                                fuel,

                            shift:
                                Number(
                                    shift
                                )

                        });


                if (error) {

                    console.error(
                        error
                    );


                    alert(
                        "❌ Data gagal disimpan.\n\n" +
                        error.message
                    );


                    saveButton.disabled =
                        false;


                    saveButton.textContent =
                        "SIMPAN DATA";


                    return;

                }


                alert(

                    "✅ Data berhasil disimpan!\n\n" +

                    "Unit: " +
                    currentUnit +
                    "\n" +

                    "Operator: " +
                    operator +
                    "\n" +

                    "HM Sebelumnya: " +
                    (
                        previousHM > 0
                        ? previousHM
                        : "-"
                    ) +
                    "\n" +

                    "HM Sekarang: " +
                    currentHM +
                    "\n" +

                    "HM Jalan: " +
                    hmJalan +
                    "\n" +

                    "Fuel: " +
                    fuel +
                    " L\n" +

                    "Shift: " +
                    shift

                );


                location.reload();

            }
        );

</script>

</body>
</html>
