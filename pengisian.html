<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pengisian Fuel - KPP FMS</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .info {
            background: #eff6ff;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .scan-box {
            background: #f3f4f6;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .scan-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .scan-btn {
            background: #16a34a;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .data-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label {
            color: #666;
            font-size: 14px;
        }

        .data-value {
            font-weight: bold;
        }

        .previous-hm {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .previous-hm small {
            display: block;
            color: #777;
            margin-bottom: 5px;
        }

        .previous-hm strong {
            font-size: 25px;
            color: #ea580c;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .hm-result {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .hm-result small {
            display: block;
            color: #666;
            margin-bottom: 5px;
        }

        .hm-result strong {
            font-size: 24px;
            color: #16a34a;
        }

        .warning {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .save-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>KPP FUEL MANAGEMENT SYSTEM</h1>
    <p>PT KPP - Pengisian Fuel</p>
</div>

<div class="container">

    <div class="form-box">

        <h2>⛽ Pengisian Fuel</h2>

        <div class="info">
            Scan QR unit terlebih dahulu. Sistem akan menampilkan HM terakhir unit.
        </div>

        <!-- SCANNER -->
        <div class="scan-box" id="scanBox">

            <div class="scan-icon">📷</div>

            <p style="margin-bottom: 12px;">
                Scan QR Code Unit
            </p>

            <button class="scan-btn" id="scanButton">
                Scan QR
            </button>

        </div>

        <!-- DATA UNIT -->
        <div class="data-box hidden" id="unitData">

            <div class="data-row">
                <span class="data-label">Unit</span>
                <span class="data-value" id="unitDisplay">-</span>
            </div>

        </div>

        <!-- HM SEBELUMNYA -->
        <div class="previous-hm hidden" id="previousHmBox">

            <small>HM SEBELUMNYA</small>

            <strong id="previousHm">-</strong>

        </div>

        <!-- FORM -->
        <div id="formArea" class="hidden">

            <div class="form-group">

                <label>HM Sekarang</label>

                <input
                    type="number"
                    id="currentHm"
                    placeholder="Masukkan HM sekarang"
                    step="0.1"
                >

            </div>

            <!-- HASIL HM -->
            <div class="hm-result">

                <small>HM JALAN</small>

                <strong id="hmDifference">0 HM</strong>

            </div>

            <!-- WARNING -->
            <div class="warning" id="warning">
                ⚠️ HM sekarang tidak boleh lebih kecil dari HM sebelumnya.
            </div>

            <div class="form-group">

                <label>Jumlah Fuel (Liter)</label>

                <input
                    type="number"
                    id="fuelQty"
                    placeholder="Masukkan jumlah liter"
                    step="0.01"
                    min="0"
                >

            </div>

            <div class="form-group">

                <label>Shift</label>

                <select id="shift">

                    <option value="">
                        -- Pilih Shift --
                    </option>

                    <option value="1">
                        Shift 1
                    </option>

                    <option value="2">
                        Shift 2
                    </option>

                </select>

            </div>

            <button class="save-btn" id="saveButton">
                SIMPAN DATA
            </button>

        </div>

        <a href="index.html" class="back">
            ← Kembali ke Dashboard
        </a>

    </div>

</div>


<script>

    let currentUnit = "";
    let previousHM = 0;
    let scanner = null;


    // ================================
    // SCAN QR
    // ================================

    document.getElementById("scanButton").addEventListener("click", function () {

        const scanBox = document.getElementById("scanBox");

        scanBox.innerHTML = `
            <div id="reader" style="width:100%;"></div>
        `;

        scanner = new Html5Qrcode("reader");

        scanner.start(
            {
                facingMode: "environment"
            },
            {
                fps: 10,
                qrbox: 250
            },
            function(decodedText) {

                currentUnit = decodedText.trim();

                // Ambil HM terakhir dari browser
                const savedHM = localStorage.getItem(
                    "hm_" + currentUnit
                );

                if (savedHM) {

                    previousHM = parseFloat(savedHM);

                } else {

                    previousHM = 0;

                }

                document.getElementById("unitDisplay").textContent =
                    currentUnit;

                document.getElementById("unitData")
                    .classList.remove("hidden");

                document.getElementById("previousHmBox")
                    .classList.remove("hidden");

                if (previousHM > 0) {

                    document.getElementById("previousHm")
                        .textContent = previousHM.toLocaleString("id-ID");

                } else {

                    document.getElementById("previousHm")
                        .textContent = "Belum ada data";

                }

                document.getElementById("formArea")
                    .classList.remove("hidden");

                // Stop scanner
                scanner.stop();

                scanBox.innerHTML = `
                    <div class="scan-icon">✅</div>

                    <p>
                        QR berhasil dibaca
                    </p>

                    <p style="margin-top:8px;">
                        <strong>${currentUnit}</strong>
                    </p>
                `;

            },
            function(errorMessage) {

                // Scanner sedang mencari QR

            }
        ).catch(function(error) {

            scanBox.innerHTML = `
                <p style="color:red;">
                    ❌ Kamera tidak dapat dibuka.
                </p>

                <p style="margin-top:8px;">
                    Pastikan izin kamera diberikan.
                </p>
            `;

        });

    });


    // ================================
    // HITUNG HM
    // ================================

    document.getElementById("currentHm").addEventListener(
        "input",
        function() {

            const currentHM =
                parseFloat(this.value);

            const warning =
                document.getElementById("warning");

            const result =
                document.getElementById("hmDifference");


            if (isNaN(currentHM)) {

                result.textContent = "0 HM";

                warning.style.display = "none";

                return;

            }


            if (previousHM > 0 && currentHM < previousHM) {

                warning.style.display = "block";

                result.textContent = "HM TIDAK VALID";

                return;

            }


            warning.style.display = "none";


            if (previousHM > 0) {

                const difference =
                    currentHM - previousHM;

                result.textContent =
                    difference.toLocaleString("id-ID")
                    + " HM";

            } else {

                result.textContent =
                    "Data awal";

            }

        }
    );


    // ================================
    // SIMPAN DATA
    // ================================

    document.getElementById("saveButton").addEventListener(
        "click",
        function() {

            const currentHM =
                parseFloat(
                    document.getElementById("currentHm").value
                );

            const fuel =
                parseFloat(
                    document.getElementById("fuelQty").value
                );

            const shift =
                document.getElementById("shift").value;


            if (!currentUnit) {

                alert("Silakan scan QR unit terlebih dahulu.");

                return;

            }


            if (isNaN(currentHM)) {

                alert("Masukkan HM sekarang.");

                return;

            }


            if (previousHM > 0 && currentHM < previousHM) {

                alert(
                    "HM sekarang tidak boleh lebih kecil dari HM sebelumnya."
                );

                return;

            }


            if (isNaN(fuel) || fuel <= 0) {

                alert("Masukkan jumlah fuel.");

                return;

            }


            if (!shift) {

                alert("Silakan pilih shift.");

                return;

            }


            // ================================
// SIMPAN TRANSAKSI
// ================================

const transactions =
    JSON.parse(localStorage.getItem("fuelHistory")) || [];

const now = new Date();

const transaction = {
    tanggal: now.toLocaleDateString("id-ID"),
    jam: now.toLocaleTimeString("id-ID"),
    unit: currentUnit,
    hmAwal: previousHM,
    hmAkhir: currentHM,
    hmJalan: previousHM > 0 ? currentHM - previousHM : 0,
    fuel: fuel,
    shift: shift
};

transactions.push(transaction);

// Simpan seluruh riwayat
localStorage.setItem(
    "fuelHistory",
    JSON.stringify(transactions)
);

// Simpan HM terakhir untuk unit
localStorage.setItem(
    "hm_" + currentUnit,
    currentHM
);

            alert(
                "Data pengisian berhasil disimpan!\n\n" +
                "Unit: " + currentUnit + "\n" +
                "HM: " + currentHM + "\n" +
                "Fuel: " + fuel + " L\n" +
                "Shift: " + shift
            );


            // Reset form
            location.reload();

        }
    );

</script>

</body>
</html>
