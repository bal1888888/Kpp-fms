<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>System Health - KPP FMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.KPP_ALLOWED_ROLES=["gl","admin","atasan"];window.KPP_ACTIVE_PAGE="system-health";</script>
<script src="wib-time.js?v=20260911b3"></script>
<script src="auth.js?v=20260912-sidebar1"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c;--slate:#475569}
*{box-sizing:border-box;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
.header{background:#0f172a;color:#fff;text-align:center;padding:22px 14px}.header h1{margin:0;font-size:23px}.header p{margin:6px 0 0;color:#cbd5e1;font-size:12px}
.container{max-width:1180px;margin:20px auto 40px;padding:0 14px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar-copy{min-width:0}.toolbar-title{font-size:18px;font-weight:900}.period{font-size:12px;color:var(--muted);font-weight:800;margin-top:3px}.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.refresh,.filter-btn{border:0;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer;min-height:42px}.refresh{background:var(--blue);color:#fff}.refresh:disabled{opacity:.6;cursor:not-allowed}.filter-btn{background:#fff;color:#334155;border:1px solid #cbd5e1}.filter-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.summary-card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.summary-card small{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.04em}.summary-card strong{display:block;margin-top:6px;font-size:24px}.summary-meta{display:block;margin-top:4px;color:var(--muted);font-size:9px;font-weight:800}.summary-card.ok strong{color:var(--green)}.summary-card.warn strong{color:var(--amber)}.summary-card.critical strong{color:var(--red)}
.banner{display:none;margin-bottom:14px;padding:12px 14px;border-radius:11px;font-size:12px;font-weight:800;line-height:1.5}.banner.show{display:block}.banner.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}.banner.critical{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.banner.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.groups{display:grid;gap:14px}.group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.group h2{margin:0;font-size:16px}.group-count{font-size:10px;color:var(--muted);font-weight:900}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.check{border:1px solid var(--line);border-left:4px solid #94a3b8;border-radius:10px;padding:11px 12px;background:#fff}.check.ok{border-left-color:#22c55e}.check.info{border-left-color:#3b82f6}.check.warn{border-left-color:#f59e0b}.check.critical{border-left-color:#ef4444}.check-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.check-title{font-size:12px;font-weight:900;line-height:1.35}.badge{flex:0 0 auto;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.badge.ok{background:#dcfce7;color:#166534}.badge.info{background:#dbeafe;color:#1d4ed8}.badge.warn{background:#fef3c7;color:#92400e}.badge.critical{background:#fee2e2;color:#991b1b}.check-detail{margin-top:7px;color:var(--muted);font-size:10px;line-height:1.45}.check-key{margin-top:6px;color:#94a3b8;font:9px/1.3 Consolas,monospace}.loading{padding:28px;text-align:center;color:var(--muted);font-size:12px}.empty-attention{padding:24px;border:1px dashed #86efac;border-radius:12px;background:#f0fdf4;color:#166534;text-align:center;font-size:12px;font-weight:800}
.app-nav{background:#111827;border-bottom:1px solid #374151;padding:9px 12px;position:sticky;top:0;z-index:999}.app-nav-inner{max-width:1250px;margin:0 auto;display:flex;gap:8px;align-items:center;overflow-x:auto}.app-nav a{color:#e5e7eb;text-decoration:none;padding:9px 13px;border-radius:7px;white-space:nowrap;font-size:13px;font-weight:bold}.app-nav a.active{background:#2563eb;color:#fff}.kpp-userbar{background:#fff;border-bottom:1px solid #e5e7eb}.kpp-userbar-inner{max-width:1250px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}.kpp-userbar-inner span{color:#64748b}
@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.checks{grid-template-columns:1fr}.toolbar{align-items:stretch}.container{padding:0 9px}.kpp-userbar-inner{flex-wrap:wrap}.toolbar-actions{justify-content:stretch}.toolbar-actions button{flex:1}}
@media(max-width:430px){.header{padding:17px 10px}.header h1{font-size:18px}.summary-card strong{font-size:20px}.toolbar{display:block}.toolbar-actions{margin-top:9px;display:grid;grid-template-columns:1fr}.group{padding:12px}}
</style>
<link rel="stylesheet" href="kpp-ui-polish.css?v=20260911b3">
</head>
<body>
<div class="header"><h1>KPP FUEL MANAGEMENT SYSTEM</h1><p>System Health • Integrity, Security, Shift & Delivery</p></div>
<div id="kppUserBar" class="kpp-userbar"></div>
<div id="kppRoleNav"></div>
<main class="container">
  <div class="toolbar">
    <div class="toolbar-copy"><div class="toolbar-title">Kesehatan Sistem</div><div id="period" class="period">Memuat periode operasional...</div></div>
    <div class="toolbar-actions"><button id="attentionBtn" class="filter-btn" type="button" aria-pressed="false">HANYA PERLU PERHATIAN</button><button id="refreshBtn" class="refresh" type="button">↻ REFRESH AUDIT</button></div>
  </div>
  <div id="banner" class="banner"></div>
  <section class="summary">
    <div class="summary-card ok"><small>CHECK AMAN</small><strong id="okCount">0</strong><span id="okMeta" class="summary-meta">0 item bermasalah</span></div>
    <div class="summary-card warn"><small>PERLU CEK</small><strong id="warnCount">0</strong><span id="warnMeta" class="summary-meta">0 item</span></div>
    <div class="summary-card critical"><small>KRITIS</small><strong id="criticalCount">0</strong><span id="criticalMeta" class="summary-meta">0 item</span></div>
    <div class="summary-card"><small>INFO OPERASIONAL</small><strong id="infoCount">0</strong><span id="infoMeta" class="summary-meta">0 item</span></div>
  </section>
  <div id="groups" class="groups"><div class="loading">Menjalankan audit read-only...</div></div>
</main>
<script>
const db=window.KPP.db;
const CATEGORY_ORDER=["SECURITY","OPERATOR","CCR","FUEL","HM","STOCK","MASTER","SHIFT","DELIVERY","LEGACY"];
const CATEGORY_LABEL={SECURITY:"Keamanan",OPERATOR:"Operator",CCR:"CCR",FUEL:"Pengisian Fuel",HM:"HM",STOCK:"Stock",MASTER:"Master Data",SHIFT:"Operasional Shift",DELIVERY:"Reliable Submission",LEGACY:"Legacy / Histori Lama"};
const LABEL={OK:"AMAN",INFO:"INFO",WARN:"CEK",CRITICAL:"KRITIS"};
let HEALTH_ROWS=[];
let ATTENTION_ONLY=false;
function severityClass(value){const v=String(value||"INFO").toLowerCase();return ["ok","info","warn","critical"].includes(v)?v:"info"}
function setText(id,value){const el=document.getElementById(id);if(el)el.textContent=String(value??"")}
function issueTotal(rows,severity){return rows.filter(row=>row.severity===severity).reduce((sum,row)=>sum+Number(row.issue_count||0),0)}
function createCheck(row){
  const cls=severityClass(row.severity);const card=document.createElement("div");card.className="check "+cls;
  const top=document.createElement("div");top.className="check-top";
  const title=document.createElement("div");title.className="check-title";title.textContent=row.label||row.check_key||"Check";
  const badge=document.createElement("span");badge.className="badge "+cls;badge.textContent=(LABEL[row.severity]||row.severity||"INFO")+" • "+Number(row.issue_count||0).toLocaleString("id-ID");
  top.append(title,badge);
  const detail=document.createElement("div");detail.className="check-detail";detail.textContent=row.detail||"";
  const key=document.createElement("div");key.className="check-key";key.textContent=row.check_key||"";
  card.append(top,detail,key);return card;
}
function renderSummary(list){
  const counts={OK:0,INFO:0,WARN:0,CRITICAL:0};list.forEach(row=>{counts[row.severity]=(counts[row.severity]||0)+1});
  setText("okCount",counts.OK);setText("infoCount",counts.INFO);setText("warnCount",counts.WARN);setText("criticalCount",counts.CRITICAL);
  setText("okMeta",issueTotal(list,"OK")+" item bermasalah");
  setText("infoMeta",issueTotal(list,"INFO")+" item");
  setText("warnMeta",issueTotal(list,"WARN")+" item");
  setText("criticalMeta",issueTotal(list,"CRITICAL")+" item");
  const banner=document.getElementById("banner");banner.className="banner show";
  const criticalItems=issueTotal(list,"CRITICAL"),warnItems=issueTotal(list,"WARN");
  if(counts.CRITICAL>0){banner.classList.add("critical");banner.textContent=`Ada ${counts.CRITICAL} check kritis (${criticalItems} item). Buka detail sebelum melakukan koreksi data.`}
  else if(counts.WARN>0){banner.classList.add("warn");banner.textContent=`Tidak ada error kritis. Ada ${counts.WARN} area yang perlu dicek (${warnItems} item).`}
  else{banner.classList.add("ok");banner.textContent="Integrity utama aman. Item INFO hanya status/progres operasional."}
}
function renderGroups(list){
  const groups=document.getElementById("groups");groups.replaceChildren();
  const visible=ATTENTION_ONLY?list.filter(row=>row.severity!=="OK"):list;
  if(!visible.length){const empty=document.createElement("div");empty.className="empty-attention";empty.textContent="Tidak ada item yang memerlukan perhatian pada snapshot ini.";groups.appendChild(empty);return}
  const byCategory=new Map();visible.forEach(row=>{const key=row.category||"LAINNYA";if(!byCategory.has(key))byCategory.set(key,[]);byCategory.get(key).push(row)});
  const ordered=[...byCategory.keys()].sort((a,b)=>{const ai=CATEGORY_ORDER.indexOf(a),bi=CATEGORY_ORDER.indexOf(b);return (ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b)});
  ordered.forEach(category=>{
    const rows=byCategory.get(category);const section=document.createElement("section");section.className="group";
    const head=document.createElement("div");head.className="group-head";
    const h=document.createElement("h2");h.textContent=CATEGORY_LABEL[category]||category;
    const count=document.createElement("span");count.className="group-count";count.textContent=rows.length+" CHECK";
    head.append(h,count);const checks=document.createElement("div");checks.className="checks";rows.forEach(row=>checks.appendChild(createCheck(row)));section.append(head,checks);groups.appendChild(section);
  });
}
function render(rows){
  HEALTH_ROWS=Array.isArray(rows)?rows:[];const first=HEALTH_ROWS[0];setText("period",first?`${first.operational_date} • ${first.operational_shift} • WIB (server)`:"Periode tidak tersedia");
  renderSummary(HEALTH_ROWS);renderGroups(HEALTH_ROWS);
}
function toggleAttention(){
  ATTENTION_ONLY=!ATTENTION_ONLY;const btn=document.getElementById("attentionBtn");btn.classList.toggle("active",ATTENTION_ONLY);btn.setAttribute("aria-pressed",String(ATTENTION_ONLY));btn.textContent=ATTENTION_ONLY?"TAMPILKAN SEMUA":"HANYA PERLU PERHATIAN";renderGroups(HEALTH_ROWS);
}
async function loadHealth(){
  const btn=document.getElementById("refreshBtn");const groups=document.getElementById("groups");btn.disabled=true;btn.textContent="MEMERIKSA...";
  groups.replaceChildren(Object.assign(document.createElement("div"),{className:"loading",textContent:"Menjalankan audit read-only..."}));
  try{const {data,error}=await db.rpc("kpp_system_health_snapshot");if(error)throw error;render(data||[])}
  catch(error){const banner=document.getElementById("banner");banner.className="banner show error";banner.textContent="Gagal membaca System Health: "+(error?.message||"Unknown error");groups.replaceChildren()}
  finally{btn.disabled=false;btn.textContent="↻ REFRESH AUDIT"}
}
async function init(){
  const auth=await window.KPP.requireRoles(["gl","admin","atasan"]);if(!auth)return;
  window.KPP.renderNav(auth.profile,"system-health");window.KPP.renderUserBar(auth.profile);
  await loadHealth();
}
document.getElementById("refreshBtn").addEventListener("click",loadHealth);
document.getElementById("attentionBtn").addEventListener("click",toggleAttention);
init().catch(error=>{const b=document.getElementById("banner");b.className="banner show error";b.textContent="System Health gagal dibuka: "+error.message});
</script>
</body>
</html>
