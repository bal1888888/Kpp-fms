<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fuelman - KPP FMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.KPP_ALLOWED_ROLES=["fuelman"];
window.KPP_ACTIVE_PAGE="fuelman";
</script>
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f3f4f6;color:#111827}
.header{background:#1f2937;color:#fff;text-align:center;padding:21px}
.header h1{margin:0 0 5px;font-size:23px}
.container{max-width:1050px;margin:28px auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{display:block;text-decoration:none;color:#111827;background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:22px;box-shadow:0 3px 11px rgba(0,0,0,.07)}
.card:hover{transform:translateY(-2px)}
.icon{font-size:34px;margin-bottom:10px}
.card strong{display:block;font-size:18px;margin-bottom:6px}
.card span{font-size:12px;color:#64748b;line-height:1.5}
.app-nav{background:#111827;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid #374151;padding:9px 12px;position:sticky;top:0;z-index:999}
.app-nav-inner{max-width:1250px;margin:0 auto;display:flex;justify-content:center;gap:12px;align-items:center;overflow-x:auto}
.app-nav a{color:#e5e7eb;text-decoration:none;padding:10px 16px;border-radius:7px;white-space:nowrap;font-size:13px;font-weight:bold}
.app-nav a.active{background:#2563eb;color:#fff}
.kpp-userbar{background:#fff;border-bottom:1px solid #e5e7eb}
.kpp-userbar-inner{max-width:1250px;margin:0 auto;padding:8px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}
.kpp-userbar-inner span{color:#64748b}
.kpp-userbar button{border:0;border-radius:7px;padding:8px 11px;background:#dc2626;color:#fff;font-weight:bold;cursor:pointer}
@media(max-width:700px){.app-nav-inner{justify-content:flex-start}}
</style>
</head>
<body>
<div class="header">
  <h1>KPP FUEL MANAGEMENT SYSTEM</h1>
  <div>Display Fuelman</div>
</div>

<div id="kppUserBar" class="kpp-userbar"></div>
<div id="kppRoleNav"></div>

<div class="container">
  <div class="grid">
    <a class="card" href="pengisian.html">
      <div class="icon">⛽</div>
      <strong>Pengisian Fuel</strong>
      <span>Input pengisian fuel unit.</span>
    </a>

    <a class="card" href="stock.html">
      <div class="icon">🛢️</div>
      <strong>Stock Fuel</strong>
      <span>Opening, penerimaan, transfer, dan closing stock.</span>
    </a>
  </div>
</div>
</body>
</html>
